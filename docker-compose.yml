services:
  posterflow:
    image: dweagle/posterflow:latest
    container_name: posterflow
    ports:
      - 8357:8000
    volumes:
      - ./config:/config   # Database, rclone config, logs, default poster dir, and idarr working dir
      # - ./posters:/posters  # Optional: mount a custom poster/gdrive storage path (configure path in Settings)
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      # - EXTRA_GROUPS=999  # Optional: extra group ids, comma-separated. The Plex user's group lets Clean up Plex uploads delete in Plex's Metadata folder.
      - TZ=UTC
    restart: unless-stopped
