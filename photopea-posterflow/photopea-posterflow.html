<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posterflow — Photopea plugin</title>
<!--
  Standalone Photopea PLUGIN panel for CL2K / MM2K season posters. Fully self-contained:
  it talks ONLY to Photopea (via window.parent) and never calls any external server, so it
  works on any PSD you open manually. Saving is native — Ctrl+S overwrites the file you
  opened on disk; the JPG button downloads a flattened copy in the browser.

  What it does with the ACTIVE document:
   - reads the SEASONS / SPECIALS / SEQUEL layers and gives you toggle chips
   - shows the template style (CL2K / MM2K), detected from the layer structure
   - Place Logo / Fit Poster: resize + position the SELECTED layer with the poster formula
   - JPG: download a flattened JPG (named after the doc + the visible season)

  Install: host this file at a stable HTTPS URL, then in Photopea do
  Window ▸ Plugins ▸ Add Plugin and upload the manifest.json that points at it.
  Photopea API: https://www.photopea.com/api/
-->
<style>
  html, body { margin: 0; height: 100%; background: #1f1f24; color: #e6e6e6;
    font: 12px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  /* Big style badge — which template (CL2K/MM2K) the ACTIVE doc is, detected from its layers. */
  .style-head { padding: 7px 8px; background: #23232a; border-bottom: 1px solid #3a3a42; text-align: center; }
  .style-name { font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #8a8a94; }
  .style-name.cl2k { color: #3fae62; }
  .style-name.mm2k { color: #5a86f0; }
  .head { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 5px 6px; background: #2a2a31; border-bottom: 1px solid #3a3a42; }
  .title { font-weight: 600; flex: 1; }
  .btn { cursor: pointer; background: #3a3a42; border: 0; color: #e6e6e6; border-radius: 4px; padding: 3px 7px; font-size: 12px; line-height: 1.4; }
  .btn:hover { background: #4a4a54; }
  /* Two batch bolts, distinguished by color: amber = name-tag batch, blue = seasons-from-one-poster. */
  .btn.bolt-tags { background: #8a5a1c; }
  .btn.bolt-tags:hover { background: #a06a24; }
  .btn.bolt-seasons { background: #2b5c9e; }
  .btn.bolt-seasons:hover { background: #356ec0; }
  .singles, .sequels { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 8px; border-bottom: 1px solid #3a3a42; }
  .singles.hidden, .sequels.hidden { display: none; }
  .rowlabel { color: #9aa; margin-right: 2px; }
  .tools { display: flex; gap: 5px; padding: 6px; border-bottom: 1px solid #3a3a42; }
  .tools .btn { flex: 1; }
  .list { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; overflow-y: auto; padding: 8px; flex: 1; scrollbar-width: thin; scrollbar-color: #3a3a42 transparent; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: #3a3a42; border-radius: 3px; }
  .chip { min-width: 16px; text-align: center; box-sizing: border-box; background: #2a2a31; border: 1px solid #3a3a42;
    color: #cfcfcf; border-radius: 6px; padding: 1px 6px; line-height: 1; cursor: pointer; user-select: none; }
  .chip:hover { filter: brightness(1.25); }
  .chip.on  { background: #2e7d46; border-color: #3fae62; color: #fff; }
  .chip.off { background: #4a4a55; border-color: #5a5a66; color: #e6e6e6; }
  .chip.grp { font-weight: 700; flex-basis: 100%; }
  .chip.grp.on { background: #3b6bd6; border-color: #5a86f0; }
  .chip.num { width: 28px; padding-left: 2px; padding-right: 2px; }
  .msg { padding: 8px; color: #9aa; }
  .trimbar { display: flex; justify-content: center; padding: 6px; border-top: 1px solid #3a3a42; background: #23232a; }
  .trimbar .btn { padding: 4px 18px; }
  .batchbar { padding: 8px; background: #23232a; border-bottom: 1px solid #3a3a42; }
  .batchbar.hidden { display: none; }
  .batchmsg { color: #cfcfcf; font-size: 11px; margin-bottom: 6px; }
  .batchrow { display: flex; gap: 5px; }
  .batchrow.hidden { display: none; }
  .batchinput { flex: 1; min-width: 0; background: #1f1f24; border: 1px solid #3a3a42; color: #e6e6e6;
    border-radius: 4px; padding: 3px 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="style-head"><span class="style-name" data-el="style">—</span></div>
  <div class="head">
    <button class="btn" data-act="jpg" title="Download a flattened JPG of the poster">JPG</button>
    <button class="btn bolt-tags" data-act="batch" title="Name-tag batch — one JPG per tagged layer (s0/s1…/main/show/c)">⚡</button>
    <button class="btn bolt-seasons" data-act="batch-seasons" title="Seasons from one poster — pick a range and export Season 1…N (+ Specials) from a single poster">⚡</button>
    <button class="btn" data-act="refresh" title="Reload layers from the active document">⟳</button>
  </div>
  <div class="tools">
    <button class="btn" data-act="logo" title="Resize &amp; place the SELECTED layer as a logo (keeps the logo's colors)">Place Logo</button>
    <button class="btn" data-act="fit" title="Fit the SELECTED poster layer inside the 25px border (top-aligned, centered)">Fit Poster</button>
  </div>
  <div class="batchbar hidden">
    <div class="batchmsg"></div>
    <div class="batchrow hidden">
      <input class="batchinput" type="text" placeholder="e.g. 8, 0-5, or blank = all" />
      <button class="btn" data-act="batch-run">Run</button>
      <button class="btn" data-act="batch-cancel" title="Cancel">✕</button>
    </div>
  </div>
  <div class="singles hidden"></div>
  <div class="sequels hidden"></div>
  <div class="list"><div class="msg">Loading…</div></div>
  <div class="trimbar">
    <button class="btn" data-act="trim" title="Trim off-canvas pixels from ALL layers — shrinks the saved file, no visible change. Save after.">Trim</button>
  </div>

<script>
(function () {
  'use strict';

  const PP      = window.parent;                 // top-level Photopea hosts this panel
  const singles = document.querySelector('.singles');
  const sequels = document.querySelector('.sequels');
  const list    = document.querySelector('.list');
  const jpgBtn  = document.querySelector('[data-act="jpg"]');
  const logoBtn = document.querySelector('[data-act="logo"]');
  const fitBtn  = document.querySelector('[data-act="fit"]');
  const trimBtn = document.querySelector('[data-act="trim"]');
  let trimBusy = false;
  const styleName = document.querySelector('[data-el="style"]');
  let model = { singles: [], seasons: [], sequels: [] };
  let jpgBusy = false;
  let placeBusy = false, pendingMode = '';  // Place Logo / Fit Poster state
  let placeBtn = null, placeLabel = '', placeWatch = null, pendingRes = null;  // in-flight button + watchdog + target geom
  let pendingDocName = 'poster';                  // active doc's (possibly mangled) name — used for the JPG filename
  let detectedStyle = '';                          // CL2K/MM2K guessed from the active doc's layer structure
  let batchBusy = false, batchItems = [], batchIdx = 0, batchBase = '', batchStyle = '', batchOk = 0, batchConvention = false, batchMode = 'tags';  // batch-export state ('tags' = name-tag convention, 'seasons' = season range from one poster)
  let batchSeasonText = [], batchSpecialsText = [];  // "Season N" / "Specials" text layers found by the batch scan (to pair with s-layers)
  let lastActiveSig = null;                         // active-doc watcher: signature (name+source+CL2K/MM2K structure) of the doc we last read; a change re-reads the panel

  // ---- talk to Photopea ----------------------------------------------------
  const send = (script) => PP.postMessage(script, '*');

  const FETCH = `try{
    if(app.documents.length===0){app.echoToOE('SZ:'+JSON.stringify({singles:[],seasons:[]}));}
    else{
      var d=app.activeDocument;
      var SING=[{re:/^specials$/i,lab:'SP'},{re:/^collection$/i,lab:'C'},{re:/^complete limited/i,lab:'CLS'}];
      var singles=[];
      function fs(ls,pa,pv){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);var ev=pv&&L.visible;
        for(var k=0;k<SING.length;k++){if(SING[k].re.test(L.name)){singles.push({lab:SING[k].lab,n:L.name,p:here,v:ev});}}
        if(L.typename=='LayerSet'){fs(L.layers,here,ev);}}}
      fs(d.layers,[],true);

      function find(ls,pa){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);
        if(L.typename=='LayerSet'&&/^\\s*seasons\\s*$/i.test(L.name))return {L:L,p:here};
        if(L.typename=='LayerSet'){var f=find(L.layers,here);if(f)return f;}}return null;}
      function cls(L,pr){
        if(pr=='main'){if(L.typename=='LayerSet'){if(/\\d+\\s*-\\s*\\d+/.test(L.name))return 'decade';if(/years/i.test(L.name))return 'years';return 'group';}return 'otherLeaf';}
        if(pr=='decade')return (L.typename=='LayerSet')?'group':'season';
        if(pr=='years')return 'year';
        return 'other';
      }
      var seasons=[];
      function walk(node,path,role,pv){var ev=pv&&node.visible;
        seasons.push({n:node.name,p:path,g:(node.typename=='LayerSet'),v:ev,r:role});
        if(node.typename=='LayerSet'){for(var i=0;i<node.layers.length;i++){var c=node.layers[i];walk(c,path.concat(i),cls(c,role),ev);}}
      }
      var root=find(d.layers,[]);
      if(root){walk(root.L,root.p,'main',true);}

      // SEQUEL group: a flat top-level group unique to the MM2K template (SEQUEL 1..N).
      // Absent on CL2K → sequels stays empty. Each numbered leaf becomes a toggle chip.
      var sequels=[];
      function findSeq(ls,pa){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);
        if(L.typename=='LayerSet'&&/^\\s*sequels?\\s*$/i.test(L.name))return {L:L,p:here};
        if(L.typename=='LayerSet'){var f=findSeq(L.layers,here);if(f)return f;}}return null;}
      var sq=findSeq(d.layers,[]);
      if(sq){var gv=sq.L.visible;for(var i=0;i<sq.L.layers.length;i++){var c=sq.L.layers[i];
        if(c.typename!='LayerSet'){sequels.push({n:c.name,p:sq.p.concat(i),v:(gv&&c.visible)});}}}

      // Style guess: a LOGO group means CL2K; else a SEQUEL group means MM2K; else unknown.
      function findLogo(ls){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=='LayerSet'){if(/^\\s*logos?\\s*$/i.test(L.name))return true;if(findLogo(L.layers))return true;}}return false;}
      var detStyle=findLogo(d.layers)?'CL2K':(sq?'MM2K':'');

      app.echoToOE('SZNAME:'+app.activeDocument.name);
      app.echoToOE('SZDET:'+detStyle);
      app.echoToOE('SZSIG:'+d.name+'\\u0001'+(''+(d.source||''))+'\\u0001'+detStyle);
      app.echoToOE('SZ:'+JSON.stringify({singles:singles,seasons:seasons,sequels:sequels,seqGroup:(sq?sq.p:null)}));
    }
  }catch(e){app.echoToOE('SZERR:'+e);}`;

  const fetchLayers = () => send(FETCH);

  const setVis = (changes) => send(
    `try{var dd=app.activeDocument;var ch=${JSON.stringify(changes)};` +
    `for(var j=0;j<ch.length;j++){var c=dd,L=null,p=ch[j].p;` +
    `for(var i=0;i<p.length;i++){L=c.layers[p[i]];c=L;}L.visible=ch[j].v;}` +
    `app.echoToOE('SZVIS:ok');}catch(e){app.echoToOE('SZERR:'+e);}`
  );

  // ---- helpers -------------------------------------------------------------
  const label = (name) => {
    const r = name.replace(/seasons?|text/ig, '').trim();
    if (r === '') return 'S';
    if (r.includes('-')) return 'S' + r.replace(/\s+/g, '');
    return r.replace(/\s+/g, '');
  };
  // Sequel chip label: "SEQUEL 3" → "3" (the number is the whole point).
  const seqLabel = (name) => { const m = name.match(/(\d+)/); return m ? m[1] : (name.replace(/sequels?/ig, '').trim() || 'S'); };
  const key = (p) => JSON.stringify(p);
  const seqs = () => model.sequels || [];
  const allNodes = () => model.singles.concat(model.seasons).concat(seqs());
  const byRole = (r) => model.seasons.filter((n) => n.r === r);

  // Hide every sequel leaf (+ the SEQUEL group) — used when a season/single is chosen so
  // sequels stay mutually exclusive with everything else. No-ops on CL2K (no sequels).
  const seqOff = () => seqs().map((sq) => ({ p: sq.p, v: false }));
  // Hide the whole SEQUEL group by its own path (from FETCH) — robust even if the group's children
  // are nested / not detected as leaf chips; fall back to deriving it from the first sequel leaf.
  const seqGroupOff = () => model.seqGroup ? [{ p: model.seqGroup, v: false }] : (seqs().length ? [{ p: seqs()[0].p.slice(0, -1), v: false }] : []);

  const commit = (changes) => {
    setVis(changes);
    changes.forEach((ch) => { const k = key(ch.p); allNodes().forEach((n) => { if (key(n.p) === k) n.v = ch.v; }); });
    render();
  };

  // ---- click behaviours ----------------------------------------------------
  const main = () => byRole('main')[0];

  const clickSeason = (S) => {
    if (S.v) { commit([{ p: S.p, v: false }]); return; }
    const parentKey = key(S.p.slice(0, -1));
    const changes = [{ p: S.p, v: true }];
    if (main()) changes.push({ p: main().p, v: true });
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: key(dn.p) === parentKey }));
    byRole('season').forEach((sn) => { if (sn !== S) changes.push({ p: sn.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    commit(changes);
  };

  const clickSingle = (SI) => {
    if (SI.v) { commit([{ p: SI.p, v: false }]); return; }
    const changes = [{ p: SI.p, v: true }];
    // Legacy PSDs nest singles inside SEASONS / wrapper groups ("SPECIALS TEXT", etc.) — turning on
    // just the leaf shows nothing, so reveal every ancestor group too (no-op for root-level singles).
    for (let i = 1; i < SI.p.length; i++) changes.push({ p: SI.p.slice(0, i), v: true });
    model.singles.forEach((x) => { if (x !== SI) changes.push({ p: x.p, v: false }); });
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    commit(changes);
  };

  // MM2K only: sequel badges (SEQUEL 1..N) — mutually exclusive with each other, seasons, and singles.
  const clickSequel = (SQ) => {
    if (SQ.v) { commit([{ p: SQ.p, v: false }, ...seqGroupOff()]); return; }
    const changes = [{ p: SQ.p, v: true }];
    for (let i = 1; i < SQ.p.length; i++) changes.push({ p: SQ.p.slice(0, i), v: true });  // reveal SEQUEL group
    seqs().forEach((x) => { if (x !== SQ) changes.push({ p: x.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    if (main()) changes.push({ p: main().p, v: false });
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    commit(changes);
  };

  // Lowest-numbered season leaf (Season 1 when present) — the default when SEASONS is switched on.
  const firstSeason = () => {
    const ss = byRole('season');
    if (!ss.length) return null;
    let best = ss[0], bestNum = Infinity;
    ss.forEach((s) => { const m = (s.n || '').match(/(\d+)/); const n = m ? parseInt(m[1], 10) : Infinity; if (n < bestNum) { bestNum = n; best = s; } });
    return best;
  };

  // Main SEASONS group chip: OFF clears every season + decade under it (so it doesn't silently
  // restore the old selection next time); ON shows the group and auto-selects the first season.
  const clickMain = (M) => {
    if (M.v) {
      const changes = [{ p: M.p, v: false }];
      byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
      byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
      commit(changes);
      return;
    }
    const changes = [{ p: M.p, v: true }];
    const first = firstSeason();
    if (first) {
      const parentKey = key(first.p.slice(0, -1));
      changes.push({ p: first.p, v: true });
      byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: key(dn.p) === parentKey }));
      byRole('season').forEach((sn) => { if (sn !== first) changes.push({ p: sn.p, v: false }); });
    }
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    commit(changes);
  };

  const clickDecade = (D) => {
    if (D.v) { commit([{ p: D.p, v: false }]); return; }
    const changes = [];
    if (main()) changes.push({ p: main().p, v: true });
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: dn === D }));
    changes.push(...seqOff(), ...seqGroupOff());
    commit(changes);
  };

  // ---- render --------------------------------------------------------------
  const chip = (text, on, folder) => {
    const c = document.createElement('div');
    c.className = 'chip ' + (on ? 'on' : 'off') + (folder ? ' grp' : '');
    c.textContent = text;
    return c;
  };

  const render = () => {
    singles.innerHTML = '';
    model.singles.forEach((SI) => {
      const c = chip(SI.lab, SI.v, false);
      c.title = SI.n;
      c.addEventListener('click', () => clickSingle(SI));
      singles.appendChild(c);
    });
    singles.classList.toggle('hidden', model.singles.length === 0);

    // Sequels (MM2K): a labeled row of numbered toggle chips, above the season list.
    sequels.innerHTML = '';
    if (seqs().length) {
      const lbl = document.createElement('span');
      lbl.className = 'rowlabel'; lbl.textContent = 'Sequel';
      sequels.appendChild(lbl);
      seqs().forEach((SQ) => {
        const c = chip(seqLabel(SQ.n), SQ.v, false);
        c.classList.add('num');
        c.title = SQ.n;
        c.addEventListener('click', () => clickSequel(SQ));
        sequels.appendChild(c);
      });
    }
    sequels.classList.toggle('hidden', seqs().length === 0);

    list.innerHTML = '';
    if (!model.singles.length && !model.seasons.length && !seqs().length) {
      list.innerHTML = '<div class="msg">No SEASONS / SPECIALS layers found. Press ⟳ once the PSD is open.</div>';
      return;
    }
    let decadeOpen = true;
    model.seasons.forEach((N) => {
      if (N.r === 'years' || N.r === 'year' || N.r === 'other' || N.r === 'group' || N.r === 'otherLeaf') return;
      if (N.r === 'decade') decadeOpen = N.v;
      if (N.r === 'season' && !decadeOpen) return;
      const folder = (N.r === 'main' || N.r === 'decade');
      const c = chip(label(N.n), N.v, folder);
      c.title = N.n;
      if (N.r === 'season')      { c.classList.add('num'); c.addEventListener('click', () => clickSeason(N)); }
      else if (N.r === 'decade') c.addEventListener('click', () => clickDecade(N));
      else                       c.addEventListener('click', () => clickMain(N));   // main
      list.appendChild(c);
    });
  };

  // ---- JPG export → browser download ---------------------------------------
  const activeSuffix = () => {
    const single = model.singles.find((s) => s.v);
    if (single) {
      if (single.lab === 'SP') return ' - Specials';
      if (single.lab === 'CLS') return ' - Season 1';
      return '';
    }
    const season = model.seasons.find((n) => {
      if (n.r !== 'season' || !n.v) return false;
      const dkey = key(n.p.slice(0, -1));
      const decade = model.seasons.find((m) => m.r === 'decade' && key(m.p) === dkey);
      return (!decade || decade.v) && (!main() || main().v);
    });
    return season ? ' - Season ' + label(season.n) : '';
  };
  const flashJpg = (m) => { jpgBusy = false; jpgBtn.textContent = m; setTimeout(() => { jpgBtn.textContent = 'JPG'; }, 1400); };
  const exportJpg = () => {
    if (jpgBusy || placeBusy) return;
    jpgBusy = true; jpgBtn.textContent = '…';
    send('try{app.echoToOE("SZNAME:"+app.activeDocument.name);app.activeDocument.saveToOE("jpg:0.90")}catch(e){app.echoToOE("SZERR:"+e)}');
  };

  const download = (buf, filename) => {
    const url = URL.createObjectURL(new Blob([buf]));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);   // keep the blob alive well past the write so a slow/large download can't be truncated
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const DL_GAP = 500;   // ms between browser downloads — browsers drop rapid downloads; raise if some still skip

  // Photopea hands the exported JPG bytes back here → download it, named after the doc + the
  // visible season. (PSD saving is native: Ctrl+S overwrites the file you opened on disk.)
  const onBytes = (buf) => {
    if (batchBusy) { onBatchBytes(buf); return; }   // batch JPGs route to the queue, one at a time
    const base = pendingDocName.replace(/\.(psd|psb|jpe?g|png|webp|gif|bmp|tiff?)$/i, '');
    download(buf, base + activeSuffix() + '.jpg');
    flashJpg('✓');
  };

  // ---- Place Logo / Fit Poster ---------------------------------------------
  // Resize + position the SELECTED layer with the poster formula, entirely CLIENT-SIDE.
  // Flow: read the layer + canvas size from Photopea → compute geometry here → resize the
  // layer and re-measure its bounds → translate it into place.
  const note = (t) => list.insertAdjacentHTML('afterbegin', '<div class="msg">' + t + '</div>');

  // --- the formula ---
  // rnd = round-half-to-even (matches Python's round()) so results are pixel-stable.
  const rnd = (x) => { const f = Math.floor(x); return (Math.abs(x - f - 0.5) < 1e-9) ? (f % 2 === 0 ? f : f + 1) : Math.round(x); };
  const computeLogoGeometry = (srcW, srcH, cw, ch, density) => {
    const logoBottom = rnd(ch * (1352.13 / 1500));
    const maxLogoTop = rnd(ch * (1100.0 / 1500));
    const maxLogoH = logoBottom - maxLogoTop;
    const maxLogoW = rnd(cw * (800.0 / 1000));
    const logoPx = srcW * srcH;
    const ceiling = logoPx < 200000 ? 0.85 : (logoPx > 1500000 ? 0.93 : 0.84);
    const projHAtMax = srcH * (maxLogoW / srcW);
    const refH = cw * (90.0 / 1000);
    const targetRatio = ceiling * Math.pow(refH / Math.max(projHAtMax, refH), 0.40);
    const densityFloor = 0.58 + Math.max(0.0, density - 0.30) * 0.10;
    let targetW = rnd(cw * Math.max(densityFloor, Math.min(ceiling, targetRatio)));
    const wideThreshold = rnd(cw * (600.0 / 1000));
    let maxH = targetW > wideThreshold ? rnd(ch * (225.0 / 1500)) : maxLogoH;
    if (density < 0.30) {                    // sparse → size up
      const t = (0.30 - density) / 0.30, mult = 1.0 + t * 0.15;
      targetW = Math.min(rnd(targetW * mult), maxLogoW);
      maxH = Math.min(rnd(maxH * mult), maxLogoH);
    } else if (density > 0.60) {              // dense → tighter
      const t = (density - 0.60) / 0.40, wMult = 1.0 - t * 0.10;
      targetW = rnd(targetW * wMult);
      maxH = rnd(ch * (225.0 / 1500) * (1.0 - t * 0.55));
    }
    let scale = targetW / srcW;
    if (srcH * scale > maxH) scale = maxH / srcH;
    if (srcW * scale > maxLogoW) scale = maxLogoW / srcW;
    const w = rnd(srcW * scale), h = rnd(srcH * scale);
    return { width: w, height: h, left: Math.floor((cw - w) / 2), top: logoBottom - h };
  };
  const computePosterFitGeometry = (srcW, srcH, cw) => {
    const border = 25, targetW = Math.max(1, cw - border * 2), scale = targetW / srcW;
    const w = Math.max(1, rnd(srcW * scale)), h = Math.max(1, rnd(srcH * scale));
    return { width: w, height: h, left: Math.floor((cw - w) / 2), top: border };
  };

  // Coerce a Photopea bound/dimension to a PRIMITIVE px number. The trailing *1 matters:
  // Photopea bounds are UnitValue objects, and `number - UnitValue` arithmetic inside a script
  // sign-flips (ExtendScript trap) — so we never do bounds math in-script; nv() only echoes clean
  // numbers, and all deltas are computed in JS.
  const NV = "function nv(x){if(x==null)return 0;if(typeof x=='number')return x;var v=x;if(x.as){try{v=x.as('px');}catch(e){v=(x.value!==undefined?x.value:x);}}else if(x.value!==undefined){v=x.value;}return v*1;}";

  // Photopea follows Adobe's DOM, where bounds / translate use the document's RULER unit — if the
  // PSD's ruler is points/inches, our pixel numbers are misread (the layer flies off-canvas). So
  // every geometry script runs inside px(): force the ruler to PIXELS, do the work, then restore
  // the user's ruler. NV is included so nv() is available; the wrapper also provides the try/catch.
  const px = (work) =>
    "var _ru=null;try{_ru=app.preferences.rulerUnits;app.preferences.rulerUnits=Units.PIXELS;}catch(e){}" +
    "try{" + NV + work + "}catch(e){app.echoToOE('SZERR:'+e);}" +
    "try{if(_ru!=null)app.preferences.rulerUnits=_ru;}catch(e){}";

  // Read active-layer bounds + canvas size → echo SZGEO. (Fit Poster uses just this.)
  const READ_GEO = px(
    "var d=app.activeDocument,L=d.activeLayer,b=L.bounds;" +
    "var ll=nv(b[0]),lt=nv(b[1]),lw=Math.round(nv(b[2])-ll),lh=Math.round(nv(b[3])-lt);" +
    "app.echoToOE('SZGEO:'+JSON.stringify({cw:nv(d.width),ch:nv(d.height),lw:lw,lh:lh,ll:ll,lt:lt}));");

  // Placement is two scripts: (1) resize the layer and echo its NEW top-left as plain numbers
  // (SZRSZ:left,top); (2) the plugin computes the move in JS (no in-script UnitValue math) and
  // translates by literal numbers. Same path for Place Logo and Fit Poster — no extra documents.
  const applyPlacement = (geo, res) => {
    pendingRes = res;
    const sc = (res.width / geo.lw) * 100;
    send(px("var L=app.activeDocument.activeLayer;L.resize(" + sc + "," + sc + ");" +
      "var b=L.bounds;app.echoToOE('SZRSZ:'+nv(b[0])+','+nv(b[1]));"));
  };
  const placeTranslate = (curLeft, curTop) => {
    const res = pendingRes; pendingRes = null;
    if (!res || !isFinite(curLeft) || !isFinite(curTop)) { finishPlace(false); return; }
    const dx = res.left - curLeft, dy = res.top - curTop;   // computed in JS — no UnitValue math
    send(px("app.activeDocument.activeLayer.translate(" + dx + "," + dy + ");app.echoToOE('SZPLACED:ok');"));
  };

  const finishPlace = (ok, msg) => {
    if (placeWatch) { clearTimeout(placeWatch); placeWatch = null; }
    if (placeBtn) { const b = placeBtn, l = placeLabel; b.textContent = ok ? '✓' : '✗'; setTimeout(() => { b.textContent = l; }, 1400); }
    if (msg) note(msg);
    placeBusy = false; pendingMode = ''; placeBtn = null; pendingRes = null;
  };

  // SZGEO arrived → compute target geometry from the layer's real bounds, then place it. Place Logo
  // uses a neutral transparency ("density") — aspect ratio + pixel area (the dominant factors) are exact.
  const LOGO_DENSITY = 0.30;
  const onGeo = (json) => {
    let geo; try { geo = JSON.parse(json); } catch { finishPlace(false); return; }
    if (!(geo.lw > 0 && geo.lh > 0)) { finishPlace(false, 'Select a layer first, then press Place Logo / Fit Poster.'); return; }
    const res = pendingMode === 'logo'
      ? computeLogoGeometry(geo.lw, geo.lh, geo.cw, geo.ch, LOGO_DENSITY)
      : computePosterFitGeometry(geo.lw, geo.lh, geo.cw);
    applyPlacement(geo, res);
  };

  const startPlace = (mode, btn, lbl) => {
    if (placeBusy) return;
    placeBusy = true; pendingMode = mode; placeBtn = btn; placeLabel = lbl;
    btn.textContent = '…';
    placeWatch = setTimeout(() => finishPlace(false, 'Timed out — is a layer selected?'), 12000);
    send(READ_GEO);
  };
  const startLogo = () => startPlace('logo', logoBtn, 'Place Logo');
  const startFit  = () => startPlace('fit', fitBtn, 'Fit Poster');

  // Trim: crop the doc to its own canvas → discards every layer's off-canvas pixels to shrink the
  // saved PSD. Canvas size and all layers are preserved; no visible change. Save afterwards.
  const flashTrim = (m) => { trimBusy = false; trimBtn.textContent = m; setTimeout(() => { trimBtn.textContent = 'Trim'; }, 1400); };
  const trimDoc = () => {
    if (trimBusy || placeBusy || batchBusy) return;
    trimBusy = true; trimBtn.textContent = '…';
    send(px("var d=app.activeDocument;var w=Math.round(nv(d.width)),h=Math.round(nv(d.height));d.crop([0,0,w,h]);app.echoToOE('SZTRIM:ok');"));
  };

  // ---- Batch export --------------------------------------------------------
  // The pure batch/convention/range logic below mirrors frontend/src/lib/photopeaBatch.ts (tested by
  // frontend/tests/lib/photopeaBatch.test.ts) — keep the two in sync when changing behavior.
  // One JPG per poster variant, downloaded INDIVIDUALLY — no ZIP. Two modes: (1) layers named
  // s0/s1…/main/show → export each; (2) a single poster with a SEASONS group → ask how many seasons
  // (a count "8"=1–8, a range "3-6", or blank=all) plus any singles. One export at a time.
  const batchBtn = document.querySelector('[data-act="batch"]');            // amber ⚡ — name-tag batch
  const seasonsBtn = document.querySelector('[data-act="batch-seasons"]');  // blue ⚡ — seasons from one poster
  const batchBar = document.querySelector('.batchbar');
  const batchMsg = document.querySelector('.batchmsg');
  const batchRow = document.querySelector('.batchrow');
  const batchInput = document.querySelector('.batchinput');
  const modeBtn = () => batchMode === 'seasons' ? seasonsBtn : batchBtn;    // the bolt driving the current run
  const resetBolts = () => { batchBtn.textContent = '⚡'; seasonsBtn.textContent = '⚡'; };

  const batchNote = (t) => { batchMsg.textContent = t; };
  const closeBatch = () => { if (!batchBusy) batchBar.classList.add('hidden'); };

  const seasonNumOf = (S) => { const m = (S.n || '').match(/(\d+)/); return m ? parseInt(m[1], 10) : NaN; };
  // Always-ON visibility for a season / single (mirror clickSeason/clickSingle without the toggle-off).
  const seasonChanges = (S) => {
    const parentKey = key(S.p.slice(0, -1));
    const changes = [{ p: S.p, v: true }];
    if (main()) changes.push({ p: main().p, v: true });
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: key(dn.p) === parentKey }));
    byRole('season').forEach((sn) => { if (sn !== S) changes.push({ p: sn.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    return changes;
  };
  // Always-ON visibility for a "Season YYYY" year leaf: show it + the SEASONS group and its own
  // years group, and hide every decade, numbered season, other year, and single (its counterpart to
  // seasonChanges — the year layers live in the "SEASON YEARS TEXT" group, not under a decade).
  const yearChanges = (Y) => {
    const parentKey = key(Y.p.slice(0, -1));
    const changes = [{ p: Y.p, v: true }];
    if (main()) changes.push({ p: main().p, v: true });
    byRole('years').forEach((yg) => changes.push({ p: yg.p, v: key(yg.p) === parentKey }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('year').forEach((yn) => { if (yn !== Y) changes.push({ p: yn.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    return changes;
  };
  const singleChanges = (SI) => {
    const changes = [{ p: SI.p, v: true }];
    for (let i = 1; i < SI.p.length; i++) changes.push({ p: SI.p.slice(0, i), v: true });
    model.singles.forEach((x) => { if (x !== SI) changes.push({ p: x.p, v: false }); });
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    return changes;
  };
  const singleSuffix = (SI) => SI.lab === 'SP' ? ' - Specials' : (SI.lab === 'CLS' ? ' - Season 1' : '');
  // Show the s-layer (+ ancestors), hide the other convention leaves, AND switch on the matching
  // "Season N"/"Specials" text layer (hiding the rest) so each file has its season number.
  const conventionSuffix = (v) => v.t === 's' ? (v.n === 0 ? ' - Specials' : ' - Season ' + v.n) : '';
  const showText = (changes, t, on) => { changes.push({ p: t.p, v: on }); if (on) for (let i = 1; i < t.p.length; i++) changes.push({ p: t.p.slice(0, i), v: true }); };
  const buildConventionItems = (variants) => variants.map((v) => {
    const changes = [];
    variants.forEach((o) => changes.push({ p: o.p, v: false }));
    changes.push({ p: v.p, v: true });
    for (let i = 1; i < v.p.length; i++) changes.push({ p: v.p.slice(0, i), v: true });
    if (v.t === 's' && v.n >= 1) {
      batchSeasonText.forEach((t) => showText(changes, t, t.n === v.n));
      batchSpecialsText.forEach((t) => changes.push({ p: t.p, v: false }));
    } else if (v.t === 's' && v.n === 0) {
      batchSeasonText.forEach((t) => changes.push({ p: t.p, v: false }));
      batchSpecialsText.forEach((t) => showText(changes, t, true));
    } else {
      batchSeasonText.forEach((t) => changes.push({ p: t.p, v: false }));
      batchSpecialsText.forEach((t) => changes.push({ p: t.p, v: false }));
    }
    return { suffix: conventionSuffix(v), changes };
  });
  const parseRange = (str) => {
    const s = (str || '').trim();
    if (!s) return { start: null, end: null };
    if (s.indexOf('-') >= 0) { const parts = s.split('-'); const a = parseInt(parts[0], 10), b = parseInt(parts[1], 10); return { start: isNaN(a) ? 1 : a, end: isNaN(b) ? 9999 : b }; }
    const n = parseInt(s, 10);
    return isNaN(n) ? { start: null, end: null } : { start: 1, end: n };
  };
  const seasonItems = (start, end) => {
    const items = [];
    byRole('season').slice().sort((a, b) => (seasonNumOf(a) || 0) - (seasonNumOf(b) || 0)).forEach((S) => {
      const n = seasonNumOf(S);
      if (isNaN(n)) return;
      if ((start != null && n < start) || (end != null && n > end)) return;
      items.push({ suffix: ' - Season ' + n, changes: seasonChanges(S) });
    });
    // Specials = "season 0": include only when 0 is in the range (or "all"). Never Collection / CLS.
    if ((start == null) || (start <= 0 && (end == null || end >= 0))) {
      const SP = model.singles.find((s) => s.lab === 'SP');
      if (SP) items.push({ suffix: ' - Specials', changes: singleChanges(SP) });
    }
    return items;
  };
  // "Season YYYY" batch: same range filter as seasonItems but over the year layers. Files still use
  // the " - Season <n>" convention (so "Season 2015" lands as a normal season poster). No Specials.
  const isYearRange = (r) => (r.start != null && r.start >= 1900) || (r.end != null && r.end >= 1900);
  const yearItems = (start, end) => {
    const items = [];
    byRole('year').slice().sort((a, b) => (seasonNumOf(a) || 0) - (seasonNumOf(b) || 0)).forEach((Y) => {
      const n = seasonNumOf(Y);
      if (isNaN(n)) return;
      if ((start != null && n < start) || (end != null && n > end)) return;
      items.push({ suffix: ' - Season ' + n, changes: yearChanges(Y) });
    });
    return items;
  };

  const batchItemScript = (changes) =>
    'try{var dd=app.activeDocument;var ch=' + JSON.stringify(changes) + ';' +
    'for(var j=0;j<ch.length;j++){var c=dd,L=null,p=ch[j].p;for(var i=0;i<p.length;i++){L=c.layers[p[i]];c=L;}L.visible=ch[j].v;}' +
    'dd.saveToOE("jpg:0.90");}catch(e){app.echoToOE("SZERR:"+e);}';

  const batchNext = () => {
    if (batchIdx >= batchItems.length) { batchFinish(); return; }
    batchNote('Exporting ' + (batchIdx + 1) + '/' + batchItems.length + '…');
    send(batchItemScript(batchItems[batchIdx].changes));
  };
  const onBatchBytes = async (buf) => {
    download(buf, batchBase + batchItems[batchIdx].suffix + '.jpg');
    batchOk++; batchIdx++;
    await sleep(DL_GAP);   // browsers silently drop rapid back-to-back downloads — space them out
    batchNext();
  };
  const batchFinish = () => {
    batchBusy = false; resetBolts();
    batchNote('Done — downloaded ' + batchOk + ' JPG' + (batchOk === 1 ? '' : 's') + '.');
    fetchLayers();
    setTimeout(closeBatch, 2600);
  };
  const batchAbort = (msg) => { batchBusy = false; resetBolts(); batchNote('Stopped: ' + msg); };

  const BATCH_SCAN = 'try{var d=app.activeDocument;var out=[],stx=[],spx=[];' +
    'function sc(ls,pa){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);' +
    'var nm=(""+L.name).replace(/^\\s+|\\s+$/g,"").toLowerCase();' +
    'var m=nm.match(/^s(\\d+)$/);var sm=nm.match(/^season\\s*(\\d+)$/);' +
    'if(m){out.push({t:"s",n:parseInt(m[1],10),p:here});}else if(nm=="main"){out.push({t:"main",p:here});}else if(nm=="show"){out.push({t:"show",p:here});}else if(nm=="c"){out.push({t:"c",p:here});}' +
    'if(sm){stx.push({n:parseInt(sm[1],10),p:here});}else if(nm=="special"||nm=="specials"){spx.push({p:here});}' +
    'if(L.typename=="LayerSet"){sc(L.layers,here);}}}sc(d.layers,[]);' +
    'app.echoToOE("SZBINIT:"+JSON.stringify({variants:out,seasonText:stx,specialsText:spx,name:d.name}));}catch(e){app.echoToOE("SZERR:"+e);}';

  const startBatch = (mode) => {
    if (batchBusy) return;
    batchMode = mode;   // 'tags' (amber) or 'seasons' (blue) — the button picks the mode, no auto-detect
    batchOk = 0; batchIdx = 0;
    batchBar.classList.remove('hidden'); batchRow.classList.add('hidden');
    batchNote('Scanning…');
    send(BATCH_SCAN);
  };
  // The scan is shared; the active button (batchMode) forces which branch we take, so the two modes
  // never fight over auto-detection. 'tags' = one JPG per s0/s1…/main/show/c layer; 'seasons' = a
  // season range from a single poster's SEASONS group.
  const onBatchInit = (json) => {
    let init; try { init = JSON.parse(json); } catch (_) { batchNote('Scan failed.'); return; }
    batchBase = (init.name || pendingDocName || 'poster').replace(/\.(psd|psb|jpe?g|png|webp|gif|bmp|tiff?)$/i, '');
    batchStyle = detectedStyle;
    batchSeasonText = init.seasonText || []; batchSpecialsText = init.specialsText || [];
    const variants = init.variants || [];
    if (batchMode === 'tags') {
      if (!variants.length) { batchNote('No name-tag layers (s0/s1…/main/show/c) in this document. For a single poster with a SEASONS group, use the blue ⚡ instead.'); return; }
      batchConvention = true;
      batchItems = buildConventionItems(variants);
      batchRow.classList.remove('hidden'); batchInput.style.display = 'none';
      batchNote('Found ' + batchItems.length + ' tagged poster(s). Export all?');
    } else {
      if (!(byRole('season').length || model.singles.length)) { batchNote('No SEASONS group or season layers found. For layers tagged s0/s1…/main/show, use the amber ⚡ instead.'); return; }
      batchConvention = false;
      batchRow.classList.remove('hidden'); batchInput.style.display = ''; batchInput.value = ''; batchInput.focus();
      batchNote('Which seasons? e.g. "8" (=1–8), "0-5" (0 = Specials), "2015-2020" (years), or blank = all.');
    }
  };
  const runBatch = () => {
    if (batchBusy) return;
    if (!batchConvention) {
      const r = parseRange(batchInput.value);
      batchItems = (isYearRange(r) && byRole('year').length) ? yearItems(r.start, r.end) : seasonItems(r.start, r.end);
    }
    if (!batchItems.length) { batchNote('Nothing matched — nothing to export.'); return; }
    batchBusy = true; modeBtn().textContent = '…'; batchRow.classList.add('hidden');
    batchIdx = 0; batchOk = 0;
    batchNext();
  };

  // ---- reflect the active doc ----------------------------------------------
  // Show the detected style (CL2K/MM2K) and hide Place Logo for MM2K (text titles, no LOGO group).
  const updateDocUI = () => {
    logoBtn.style.display = (detectedStyle === 'MM2K') ? 'none' : '';   // Fit Poster stays
    styleName.textContent = detectedStyle || '—';
    styleName.className = 'style-name' + (detectedStyle === 'MM2K' ? ' mm2k' : detectedStyle === 'CL2K' ? ' cl2k' : '');
  };

  // ---- incoming messages from Photopea -------------------------------------
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (typeof d !== 'string') { onBytes(d); return; }   // ArrayBuffer = saveToOE (JPG) result
    if (d.startsWith('SZNAME:'))       { pendingDocName = d.slice(7) || 'poster'; }
    else if (d.startsWith('SZDET:'))   { detectedStyle = d.slice(6); updateDocUI(); }
    else if (d.startsWith('SZSIG:'))   { lastActiveSig = d.slice(6); }   // baseline the watcher from the read we just did → the next poll's identical sig doesn't trigger a redundant re-fetch
    else if (d.startsWith('SZBINIT:')) { onBatchInit(d.slice(8)); }
    else if (d.startsWith('SZACT:'))   { const sig = d.slice(6); if (sig !== lastActiveSig && !jpgBusy && !placeBusy && !batchBusy) { lastActiveSig = sig; fetchLayers(); } }
    else if (d.startsWith('SZGEO:'))   { onGeo(d.slice(6)); }
    else if (d.startsWith('SZRSZ:'))   { const p = d.slice(6).split(','); placeTranslate(parseFloat(p[0]), parseFloat(p[1])); }
    else if (d.startsWith('SZPLACED:')){ finishPlace(true); }
    else if (d.startsWith('SZTRIM:'))  { flashTrim('✓'); }
    else if (d.startsWith('SZERR:'))   { if (trimBusy) { flashTrim('✗'); list.insertAdjacentHTML('afterbegin', '<div class="msg">Trim failed: ' + d.slice(6) + '</div>'); } else if (batchBusy) { batchAbort(d.slice(6)); } else if (placeBusy) { finishPlace(false, 'Photopea error: ' + d.slice(6)); } else { list.innerHTML = '<div class="msg">Error: ' + d.slice(6) + '</div>'; flashJpg('JPG'); } }
    else if (d.startsWith('SZ:'))      { try { model = JSON.parse(d.slice(3)); model.sequels = model.sequels || []; const ORD = { SP: 0, C: 1, CLS: 2 }; model.singles.sort((a, b) => ORD[a.lab] - ORD[b.lab]); model.sequels.sort((a, b) => (parseInt(seqLabel(a.n), 10) || 0) - (parseInt(seqLabel(b.n), 10) || 0)); render(); } catch (_) {} }
    // SZVIS: ack handled optimistically in commit().
  });

  // ---- controls ------------------------------------------------------------
  jpgBtn.addEventListener('click', exportJpg);
  logoBtn.addEventListener('click', startLogo);
  fitBtn.addEventListener('click', startFit);
  trimBtn.addEventListener('click', trimDoc);
  document.querySelector('[data-act="refresh"]').addEventListener('click', fetchLayers);
  // Each bolt toggles ITS mode: click the same bolt again to dismiss; click the other to switch modes.
  const boltClick = (mode) => {
    if (batchBusy) return;
    if (!batchBar.classList.contains('hidden') && batchMode === mode) { closeBatch(); return; }
    startBatch(mode);
  };
  batchBtn.addEventListener('click', () => boltClick('tags'));
  seasonsBtn.addEventListener('click', () => boltClick('seasons'));
  document.querySelector('[data-act="batch-run"]').addEventListener('click', runBatch);
  document.querySelector('[data-act="batch-cancel"]').addEventListener('click', closeBatch);
  batchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runBatch(); } });

  updateDocUI();

  // Active-document watcher: the panel mirrors whatever doc is in front. Poll a SIGNATURE of the
  // active doc — name + source + its CL2K/MM2K structure (LOGO group ⇒ CL2K, SEQUEL ⇒ MM2K) — and
  // re-read layers when it changes. Keying on the name alone missed a switch between a CL2K and an
  // MM2K doc of the SAME title (same filename), so the badge stayed stale until the plugin was
  // reopened. Paused while a JPG/place op is mid-flight.
  const POLL = 'try{var sig="";if(app.documents.length){var ad=app.activeDocument;'
    + 'function hg(ls,re){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=="LayerSet"){if(re.test(L.name))return true;if(hg(L.layers,re))return true;}}return false;}'
    + 'var stt=hg(ad.layers,/^\\s*logos?\\s*$/i)?"CL2K":(hg(ad.layers,/^\\s*sequels?\\s*$/i)?"MM2K":"");'
    + 'sig=ad.name+"\\u0001"+(""+(ad.source||""))+"\\u0001"+stt;}'
    + 'app.echoToOE("SZACT:"+sig)}catch(e){}';
  setInterval(() => { if (!jpgBusy && !placeBusy && !batchBusy) send(POLL); }, 1200);

  fetchLayers();   // read the active document (press ⟳ to reload)
})();
</script>
</body>
</html>
