<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connecting to Discord…</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #121212;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <p>Completing Discord authentication… you can close this window.</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const nonce = params.get('nonce') || '';
    const error = params.get('error');

    localStorage.setItem('discord_oauth_result', JSON.stringify({
      token: token || null,
      nonce: nonce,
      error: error || null
    }));

    window.close();
  </script>
</body>
</html>
