<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photopea Editor</title>
<!--
  Posterflow's Photopea wrapper. Opened by the PSD export / "Use Existing" buttons
  (see buildPhotopeaUrl in src/api/makerTools.ts). It embeds photopea.com full-window
  and overlays a floating "Seasons" box for toggling season/Specials/Collection/CLS
  layers and a Save button.

  Why the byte-shuffling: Photopea runs on https, but Posterflow is usually reached
  over a plain-http LAN address. An https iframe inside an http page is NOT a "secure
  context", so the browser blocks Photopea from fetching/POSTing the LAN PSD (mixed
  content + private-network access). So this wrapper — same origin/scheme as the file
  server — does all the I/O itself and shuttles bytes to/from Photopea over postMessage
  (load: fetch -> postMessage ArrayBuffer; save: saveToOE -> PUT same-origin).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1f24; }
  #pp { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ---- floating layer box (hidden until we know the PSD has seasons/singles) ---- */
  #box {
    position: fixed; top: 12px; right: 12px; width: 184px; max-height: 78vh;
    display: none; flex-direction: column; z-index: 10;
    background: #1f1f24; color: #e6e6e6; border: 1px solid #3a3a42; border-radius: 3px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); font: 12px/1.4 system-ui, "Segoe UI", sans-serif;
  }
  #box .head {
    display: flex; align-items: center; gap: 3px; padding: 3px 3px;
    background: #2a2a31; border-bottom: 1px solid #3a3a42; border-radius: 3px 3px 0 0;
    cursor: move; user-select: none;
  }
  #box .title { font-weight: 600; flex: 1; }
  #box .btn {
    cursor: pointer; background: #3a3a42; border: 0; color: #e6e6e6;
    border-radius: 4px; padding: 2px 2px; font-size: 12px; line-height: 1.4;
  }
  #box .btn:hover { background: #4a4a54; }

  /* single-layer buttons row (SP / C / CLS) */
  #box .singles { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px; border-bottom: 1px solid #3a3a42; }
  #box .singles.hidden { display: none; }

  #box.collapsed .list, #box.collapsed .singles { display: none; }

  /* grid of little on/off boxes */
  #box .list { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; overflow: auto; padding: 8px; }
  #box .chip {
    min-width: 16px; text-align: center; box-sizing: border-box;
    background: #2a2a31; border: 1px solid #3a3a42; color: #cfcfcf;
    border-radius: 6px; padding: 1px 6px; line-height: 1; cursor: pointer; user-select: none;
  }
  #box .chip:hover { filter: brightness(1.25); }
  #box .chip.on  { background: #2e7d46; border-color: #3fae62; color: #fff; }      /* visible label */
  #box .chip.off { background: #4a4a55; border-color: #5a5a66; color: #e6e6e6; }   /* hidden = lighter than bg */
  #box .chip.grp { font-weight: 700; flex-basis: 100%; }                       /* folders on their own row */
  #box .chip.grp.on { background: #3b6bd6; border-color: #5a86f0; }            /* visible folder = blue */
  #box .chip.num { width: 28px; padding-left: 2px; padding-right: 2px; }       /* season numbers: equal width */
  #box .msg { padding: 8px; color: #9aa; }
</style>
</head>
<body>
  <iframe id="pp" allow="clipboard-read; clipboard-write" referrerpolicy="origin"></iframe>

  <div id="box">
    <div class="head">
      <span class="title">Seasons</span>
      <button class="btn" data-act="save" title="Save PSD to Posterflow">💾</button>
      <button class="btn" data-act="jpg" title="Export JPG">JPG</button>
      <button class="btn" data-act="refresh" title="Reload layers">⟳</button>
      <button class="btn" data-act="collapse" title="Collapse">–</button>
    </div>
    <div class="singles hidden"></div>
    <div class="list"></div>
  </div>

<script>
(function () {
  'use strict';

  const IF      = document.getElementById('pp');
  const box     = document.getElementById('box');
  const list    = box.querySelector('.list');
  const singles = box.querySelector('.singles');
  const saveBtn = box.querySelector('[data-act="save"]');
  const jpgBtn  = box.querySelector('[data-act="jpg"]');
  let model = { singles: [], seasons: [] };   // last snapshot
  let ready = false;
  let cfg = {};                 // { psd, name, save, imgBase } from the page hash
  let psdBytes = null;          // Promise<ArrayBuffer> for the PSD
  let opened = false;           // have we handed the PSD to Photopea yet?
  let saving = false;           // a PSD save round-trip is in flight
  let jpgBusy = false;          // an image export round-trip is in flight

  // ---- talk to the embedded Photopea --------------------------------------
  // We post a script string; Photopea runs it against `app` and posts back
  // whatever we app.echoToOE(...). Replies are tagged with a "PFL" prefix.
  const send = (script) => IF.contentWindow.postMessage(script, '*');

  // Returns { singles:[{lab,n,p,v}], seasons:[{n,p,g,v,r}] }
  //   singles = the SPECIALS / COLLECTION / COMPLETE LIMITED SERIES layers
  //   seasons = the SEASONS branch, each node tagged with a role r:
  //             main | decade | years | season | group | year | other | otherLeaf
  const FETCH = `try{
    if(app.documents.length===0){app.echoToOE('PFL:'+JSON.stringify({singles:[],seasons:[]}));}
    else{
      var d=app.activeDocument;
      var SING=[{re:/^specials$/i,lab:'SP'},{re:/^collection$/i,lab:'C'},{re:/^complete limited/i,lab:'CLS'}];
      var singles=[];
      function fs(ls,pa){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);
        for(var k=0;k<SING.length;k++){if(SING[k].re.test(L.name)){singles.push({lab:SING[k].lab,n:L.name,p:here,v:L.visible});}}
        if(L.typename=='LayerSet'){fs(L.layers,here);}}}
      fs(d.layers,[]);

      function find(ls,pa){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);
        if(L.typename=='LayerSet'&&/^\\s*seasons\\s*$/i.test(L.name))return {L:L,p:here};
        if(L.typename=='LayerSet'){var f=find(L.layers,here);if(f)return f;}}return null;}
      function cls(L,pr){
        if(pr=='main'){if(L.typename=='LayerSet'){if(/\\d+\\s*-\\s*\\d+/.test(L.name))return 'decade';if(/years/i.test(L.name))return 'years';return 'group';}return 'otherLeaf';}
        if(pr=='decade')return (L.typename=='LayerSet')?'group':'season';
        if(pr=='years')return 'year';
        return 'other';
      }
      var seasons=[];
      function walk(node,path,role){
        seasons.push({n:node.name,p:path,g:(node.typename=='LayerSet'),v:node.visible,r:role});
        if(node.typename=='LayerSet'){for(var i=0;i<node.layers.length;i++){var c=node.layers[i];walk(c,path.concat(i),cls(c,role));}}
      }
      var root=find(d.layers,[]);
      if(root){walk(root.L,root.p,'main');}
      app.echoToOE('PFL:'+JSON.stringify({singles:singles,seasons:seasons}));
    }
  }catch(e){app.echoToOE('PFLERR:'+e);}`;

  const fetchLayers = () => send(FETCH);

  // Apply many visibility changes in one script: [{p:[indices], v:bool}, ...]
  const setVis = (changes) => send(
    `try{var dd=app.activeDocument;var ch=${JSON.stringify(changes)};` +
    `for(var j=0;j<ch.length;j++){var c=dd,L=null,p=ch[j].p;` +
    `for(var i=0;i<p.length;i++){L=c.layers[p[i]];c=L;}L.visible=ch[j].v;}` +
    `app.echoToOE('PFLVIS:ok');}catch(e){app.echoToOE('PFLERR:'+e);}`
  );

  // ---- helpers -------------------------------------------------------------
  // "SEASONS"->"S", "SEASON 1-10 TEXT"->"S1-10", "SEASON 7"->"7", "SEASON YEARS TEXT"->"YEARS"
  const label = (name) => {
    const r = name.replace(/seasons?|text/ig, '').trim();
    if (r === '') return 'S';
    if (r.includes('-')) return 'S' + r.replace(/\s+/g, '');
    return r.replace(/\s+/g, '');
  };
  const key = (p) => JSON.stringify(p);
  const allNodes = () => model.singles.concat(model.seasons);
  const byRole = (r) => model.seasons.filter((n) => n.r === r);

  // Commit a set of changes: push to Photopea + update local snapshot + redraw.
  const commit = (changes) => {
    setVis(changes);
    changes.forEach((ch) => { const k = key(ch.p); allNodes().forEach((n) => { if (key(n.p) === k) n.v = ch.v; }); });
    render();
  };

  // ---- click behaviours (one label, automatic) ----------------------------
  const main = () => byRole('main')[0];

  const clickSeason = (S) => {
    if (S.v) { commit([{ p: S.p, v: false }]); return; }   // already on -> just hide it
    const parentKey = key(S.p.slice(0, -1));               // its decade folder
    const changes = [{ p: S.p, v: true }];
    if (main()) changes.push({ p: main().p, v: true });                       // ensure SEASONS group on
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: key(dn.p) === parentKey }));
    byRole('season').forEach((sn) => { if (sn !== S) changes.push({ p: sn.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    commit(changes);
  };

  const clickSingle = (SI) => {
    if (SI.v) { commit([{ p: SI.p, v: false }]); return; }
    const changes = [{ p: SI.p, v: true }];
    model.singles.forEach((x) => { if (x !== SI) changes.push({ p: x.p, v: false }); });
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    commit(changes);
  };

  // main = plain master toggle for the whole SEASONS group
  const clickToggle = (N) => commit([{ p: N.p, v: !N.v }]);

  // decade folders behave like an accordion: open one, collapse the rest, so only
  // one set of 10 is expanded at a time.
  const clickDecade = (D) => {
    if (D.v) { commit([{ p: D.p, v: false }]); return; }      // already open -> collapse it
    const changes = [];
    if (main()) changes.push({ p: main().p, v: true });        // SEASONS group on so the open decade shows
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: dn === D }));
    commit(changes);
  };

  // ---- render --------------------------------------------------------------
  const chip = (text, on, folder) => {
    const c = document.createElement('div');
    c.className = 'chip ' + (on ? 'on' : 'off') + (folder ? ' grp' : '');
    c.textContent = text;
    return c;
  };

  const render = () => {
    // top row: SP / C / CLS
    singles.innerHTML = '';
    model.singles.forEach((SI) => {
      const c = chip(SI.lab, SI.v, false);
      c.title = SI.n;
      c.addEventListener('click', () => clickSingle(SI));
      singles.appendChild(c);
    });
    singles.classList.toggle('hidden', model.singles.length === 0);

    // seasons grid — YEARS folder hidden; each decade collapses to just its header
    // unless it's the open (visible) one, so only one set of 10 shows at a time.
    list.innerHTML = '';
    let decadeOpen = true;
    model.seasons.forEach((N) => {
      if (N.r === 'years' || N.r === 'year' || N.r === 'other' || N.r === 'group' || N.r === 'otherLeaf') return;
      if (N.r === 'decade') decadeOpen = N.v;                  // its seasons render only while it's open
      if (N.r === 'season' && !decadeOpen) return;
      const folder = (N.r === 'main' || N.r === 'decade');
      const c = chip(label(N.n), N.v, folder);
      c.title = N.n;
      if (N.r === 'season')      { c.classList.add('num'); c.addEventListener('click', () => clickSeason(N)); }
      else if (N.r === 'decade') c.addEventListener('click', () => clickDecade(N));
      else                       c.addEventListener('click', () => clickToggle(N));   // main
      list.appendChild(c);
    });

    // surface the box when there's something to control, or a save target (so Save is reachable)
    box.style.display = (model.singles.length || model.seasons.length || cfg.save) ? 'flex' : 'none';
  };

  // ---- incoming messages from Photopea ------------------------------------
  window.addEventListener('message', (e) => {
    if (e.source !== IF.contentWindow) return;
    const d = e.data;
    if (typeof d !== 'string') { onSaved(d); return; }   // non-string = saveToOE result (ArrayBuffer)
    if (d === 'done') { if (!ready) { ready = true; openDoc(); } return; }
    if (d.startsWith('PFL:'))         { try { model = JSON.parse(d.slice(4)); const ORD = { SP: 0, C: 1, CLS: 2 }; model.singles.sort((a, b) => ORD[a.lab] - ORD[b.lab]); render(); } catch (_) {} }
    else if (d.startsWith('PFLERR:')) { box.style.display = 'flex'; list.innerHTML = '<div class="msg">Error: ' + d.slice(7) + '</div>'; flashSave('💾'); flashJpg('JPG'); }
    // PFLVIS: ack handled optimistically above.
  });

  // ---- boot Photopea -------------------------------------------------------
  const boot = (c) => {
    cfg = c || {};
    ready = false; opened = false; saving = false;
    model = { singles: [], seasons: [] };
    list.innerHTML = ''; singles.innerHTML = ''; box.style.display = 'none';
    saving = false; jpgBusy = false; saveBtn.textContent = '💾'; jpgBtn.textContent = 'JPG';
    saveBtn.style.display = cfg.save ? '' : 'none';
    jpgBtn.style.display = cfg.psd ? '' : 'none';
    // Same-origin fetch of the PSD bytes (the wrapper IS allowed to read the LAN file).
    if (cfg.psd) psdBytes = fetch(cfg.psd).then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    });
    // customIO.save: native File→Save / Ctrl+S exports the PSD back to us.
    // exportAs:true: native File→Export As / Ctrl+Shift+Alt+S sends the chosen image
    // (jpg/png/…) to us instead of Photopea downloading it. An empty config still boots
    // the editor (a bare URL would show the marketing splash instead).
    const env = { environment: {} };
    if (cfg.save) env.environment.customIO = { save: 'app.activeDocument.saveToOE("psd");', exportAs: true };
    IF.src = 'https://www.photopea.com#' + encodeURIComponent(JSON.stringify(env));
  };

  // Once Photopea is ready: hand it the PSD bytes, name the document, read layers.
  const openDoc = async () => {
    if (opened) return;
    opened = true;
    if (!psdBytes) { fetchLayers(); return; }              // nothing to open (manual/empty)
    try {
      IF.contentWindow.postMessage(await psdBytes, '*');   // Photopea opens the ArrayBuffer
    } catch (e) {
      box.style.display = 'flex';
      list.innerHTML = '<div class="msg">Could not load PSD: ' + e.message + '</div>';
      return;
    }
    // An ArrayBuffer open has no "done" callback, so wait briefly, then name + read.
    setTimeout(() => {
      if (cfg.name) send('try{app.activeDocument.name=' + JSON.stringify(cfg.name) + '}catch(e){}');
      fetchLayers();
    }, 1500);
  };

  // ---- save / export ------------------------------------------------------
  // 💾 / Ctrl+S: export the PSD and PUT it back to the export folder.
  const saveDoc = () => {
    if (!cfg.save || saving) return;
    saving = true;
    saveBtn.textContent = '…';
    send('try{app.activeDocument.saveToOE("psd")}catch(e){app.echoToOE("PFLERR:"+e)}');
  };
  // JPG button: bypass Photopea's modal and export a flattened JPG straight away.
  const exportJpg = () => {
    if (jpgBusy) return;
    jpgBusy = true;
    jpgBtn.textContent = '…';
    send('try{app.activeDocument.saveToOE("jpg")}catch(e){app.echoToOE("PFLERR:"+e)}');
  };
  const flashSave = (mark) => { saving = false; saveBtn.textContent = mark; setTimeout(() => { saveBtn.textContent = '💾'; }, 1400); };
  const flashJpg  = (mark) => { jpgBusy = false; jpgBtn.textContent = mark; setTimeout(() => { jpgBtn.textContent = 'JPG'; }, 1400); };

  const download = (buf, filename) => {
    const url = URL.createObjectURL(new Blob([buf]));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  const extOf = (u8) => {
    if (u8[0] === 0xFF && u8[1] === 0xD8) return 'jpg';
    if (u8[0] === 0x89 && u8[1] === 0x50) return 'png';
    if (u8[0] === 0x47 && u8[1] === 0x49 && u8[2] === 0x46) return 'gif';
    if (u8[0] === 0x52 && u8[1] === 0x49 && u8[2] === 0x46 && u8[3] === 0x46) return 'webp';
    if (u8[0] === 0x3C) return 'svg';
    return 'jpg';
  };

  // The image filename gets a suffix based on the active label:
  //   Specials -> " - Specials",  Complete Limited Series -> " - Season 1",
  //   an active season -> " - Season 7".  Collection / nothing -> plain title/year/ids.
  // Read from the box's current state, so toggle via the box (or ⟳) before exporting.
  const activeSuffix = () => {
    const single = model.singles.find((s) => s.v);
    if (single) {
      if (single.lab === 'SP') return ' - Specials';
      if (single.lab === 'CLS') return ' - Season 1';
      return '';                                                  // Collection -> plain name
    }
    const season = model.seasons.find((n) => {
      if (n.r !== 'season' || !n.v) return false;                 // visible season leaf...
      const dkey = key(n.p.slice(0, -1));                         // ...whose decade is open...
      const decade = model.seasons.find((m) => m.r === 'decade' && key(m.p) === dkey);
      return (!decade || decade.v) && (!main() || main().v);      // ...and SEASONS group on
    });
    return season ? ' - Season ' + label(season.n) : '';
  };

  // Photopea hands bytes back here, told apart by their magic number:
  //   PSD ("8BPS") from 💾 / Ctrl+S             -> PUT to the PSD export folder
  //   jpg/png/… from JPG button / Export As     -> PUT to the image folder, else download
  const onSaved = async (buf) => {
    const u8 = new Uint8Array(buf);
    if (u8[0] === 0x38 && u8[1] === 0x42 && u8[2] === 0x50 && u8[3] === 0x53) {   // "8BPS" = PSD
      if (!cfg.save) return;
      saveBtn.textContent = '…';
      try {
        const r = await fetch(cfg.save, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: buf });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flashSave('✓');
      } catch (e) { flashSave('✗'); console.error('Save failed:', e); }
      return;
    }
    // exported image -> configured server folder, else in-browser download
    const filename = (cfg.name || 'export') + activeSuffix() + '.' + extOf(u8);
    if (cfg.imgBase) {
      jpgBtn.textContent = '…';
      try {
        const r = await fetch(cfg.imgBase + encodeURIComponent(filename), { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: buf });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        flashJpg('✓');
      } catch (e) { flashJpg('✗'); console.error('Image save failed:', e); }
    } else {
      download(buf, filename);
      flashJpg('✓');
    }
  };

  // ---- controls ------------------------------------------------------------
  saveBtn.addEventListener('click', saveDoc);
  jpgBtn.addEventListener('click', exportJpg);

  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      saveDoc();
    }
  });
  box.querySelector('[data-act="refresh"]').addEventListener('click', fetchLayers);
  box.querySelector('[data-act="collapse"]').addEventListener('click', (e) => {
    box.classList.toggle('collapsed');
    e.target.textContent = box.classList.contains('collapsed') ? '+' : '–';
  });

  // ---- drag the box header (position persists in localStorage) -------------
  const POS_KEY = 'pflPhotopeaBoxPos';
  const savePos = () => {
    try { localStorage.setItem(POS_KEY, JSON.stringify({ left: box.style.left, top: box.style.top })); } catch (_) {}
  };
  const restorePos = () => {
    let p; try { p = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch (_) { return; }
    if (!p) return;
    const left = parseInt(p.left, 10), top = parseInt(p.top, 10);
    if (isNaN(left) || isNaN(top)) return;
    // clamp into the viewport so a resized window can't strand the box off-screen
    box.style.right = 'auto';
    box.style.left = Math.min(Math.max(0, left), Math.max(0, window.innerWidth - 184)) + 'px';
    box.style.top  = Math.min(Math.max(0, top), Math.max(0, window.innerHeight - 40)) + 'px';
  };

  const head = box.querySelector('.head');
  let drag = null;
  head.addEventListener('mousedown', (e) => {
    if (e.target.closest('.btn')) return;
    const r = box.getBoundingClientRect();
    drag = { x: e.clientX - r.left, y: e.clientY - r.top };
    box.style.right = 'auto';
    IF.style.pointerEvents = 'none';   // let mouse events pass over the iframe while dragging
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    box.style.left = (e.clientX - drag.x) + 'px';
    box.style.top  = (e.clientY - drag.y) + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = null;
    IF.style.pointerEvents = '';       // re-enable Photopea
    savePos();
  });
  restorePos();

  // ---- start ---------------------------------------------------------------
  // The wrapper payload ({ psd, name, save }) is JSON in this page's hash.
  const parseHashConfig = () => {
    const h = location.hash.slice(1);
    if (!h) return null;
    try { return JSON.parse(decodeURIComponent(h)); } catch (_) { return null; }
  };
  boot(parseHashConfig());
  // Fallback if the initial "done" never arrives.
  IF.addEventListener('load', () => setTimeout(() => { if (!ready) { ready = true; openDoc(); } }, 2500));
})();
</script>
</body>
</html>
