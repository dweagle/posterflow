    send(px('var d=app.activeDocument;var pth=' + JSON.stringify(it.p) + ';' +
      'var chg=[],cont=d,pref=[];' +
      'for(var k=0;k<pth.length;k++){for(var i=0;i<cont.layers.length;i++){var X=cont.layers[i];var want=(i==pth[k]);' +
      'if(X.visible!=want){chg.push({p:pref.concat(i),v:X.visible});X.visible=want;}}' +
      'cont=cont.layers[pth[k]];pref=pref.concat(pth[k]);}' +
      'app.echoToOE("PFLPEXVIS:"+JSON.stringify(chg));' +
      'd.saveToOE("webp:0.90");'));
  };
  const onPosterBytes = async (buf) => {
    const it = pexQueue[pexIdx];
    restorePexVis();
    try {
      if (!it) throw new Error('export queue lost');
      const jpg = await trimAlphaToJpg(buf, 0.9);
      const ex = pexCtx || {};
      const base = ex.name ? ex.name : (ex.raw || pendingDocName).replace(/\.(psd|psb|jpe?g|png|webp|gif|bmp|tiff?)$/i, '');
      let filename = base + pexSuffix(it.n) + '.jpg';
      if (pexUsed[filename]) {   // two plain-named layers in one run — number the extras
        const stem = filename.replace(/\.jpg$/i, '');
        let k = 2;
        while (pexUsed[stem + ' (' + k + ').jpg']) k++;
        filename = stem + ' (' + k + ').jpg';
      }
      pexUsed[filename] = true;
      try {
        const r = await fetch(location.origin + '/api/maker-tools/poster-exports/' + encodeURIComponent(filename), {
          method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/octet-stream' }, authHeaders()), body: jpg,
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        let folder = ''; try { folder = (await r.json()).folder || ''; } catch (_) {}
        note('Saved "' + filename + '" → ' + (folder || 'the poster export folder') + '.');
      } catch (e) {
        console.warn('Poster PUT failed, downloading instead:', e);
        download(jpg, filename);
        note('Downloaded "' + filename + '" — no poster export folder configured (or the save failed).');
        await sleep(DL_GAP);   // space rapid downloads out so the browser doesn't drop them
      }
      pexOk++; pexIdx++;
      pexNext();
    } catch (e) { pexQueue = []; flashPex('✗'); note('Poster export failed: ' + (e && e.message ? e.message : e)); }
  };

  // ---- Square Art crop -----------------------------------------------------
  // Temp-tab flow: isolate the POSTER group's visible variant → PNG → trim → open the bytes as a
  // "Square Art Crop" tab (pure art, no chrome/gutter). Presets/marquee pick the square there;
  // Crop cuts it from the STORED PNG (no re-export), saves, closes the tab, returns to the PSD.
  const SQ_MIN = 500;   // square art must be at least 500×500
  const SQ_TEMP = 'Square Art Crop';   // the crop tab's name — how we verify, find, and close it
  // ActionManager slct — the only working tool switch (app.currentTool is a no-op). It SWITCHES
  // but still throws, so it's fire-and-forget: never branch on it.
  const SQ_TOOL_JS = 'function swT(t){try{var r=new ActionReference();r.putClass(stringIDToTypeID(t));var dd=new ActionDescriptor();dd.putReference(charIDToTypeID("null"),r);executeAction(charIDToTypeID("slct"),dd,DialogModes.NO);}catch(e){}}';
  const restorePosterVis = () => { if (posterRestore && posterRestore.length) setVis(posterRestore); posterRestore = null; };
  // Close the crop tab (by name — the user may have switched docs) and reactivate the poster PSD.
  const closeTempReturnHome = () => {
    if (!sqTempName) return;
    send('try{var D=app.documents;for(var i=0;i<D.length;i++){if(D[i].name==' + JSON.stringify(sqTempName) + '){app.activeDocument=D[i];app.activeDocument.close(SaveOptions.DONOTSAVECHANGES);break}}' +
      'if(' + JSON.stringify(sqHomeName) + '){for(var i=0;i<app.documents.length;i++){if(app.documents[i].name==' + JSON.stringify(sqHomeName) + '){app.activeDocument=app.documents[i];break}}}' +
      '}catch(e){}');
    sqTempName = '';
  };
  const disarmSquare = () => {
    sqArmed = false; squareArtBusy = false; sqPresets.classList.add('hidden'); sqCancelBtn.classList.add('hidden'); squareArtBtn.textContent = 'Square Art';
    posterExpBtn.classList.remove('hidden');
    closeTempReturnHome();
    sqArt = null; sqCtx = null; sqWant = 0;
    send('try{' + SQ_TOOL_JS + 'swT("moveTool");}catch(e){}');   // hand the Move tool back
  };
  const flashSquare = (m) => {
    squareArtBusy = false; sqArmed = false; sqPresets.classList.add('hidden'); sqCancelBtn.classList.add('hidden');
    posterExpBtn.classList.remove('hidden');
    squareArtBtn.textContent = m; setTimeout(() => { if (!sqArmed) squareArtBtn.textContent = 'Square Art'; }, 1400);
    closeTempReturnHome();
    sqArt = null; sqCtx = null; sqWant = 0;
    send('try{' + SQ_TOOL_JS + 'swT("moveTool");}catch(e){}');   // done (or failed) — hand the Move tool back
  };
  const placePreset = (size) => {
    if (squareArtBusy) return;
    sqWant = size;   // remembered so a preset larger than the art can upscale the output to match
    send(px(SQ_TOOL_JS + "var d=app.activeDocument;var w=Math.round(nv(d.width)),h=Math.round(nv(d.height));" +
      "var s=Math.min(" + size + ",w,h);var x=Math.round((w-s)/2),y=Math.max(0,Math.min(100,h-s));" +   // horizontally centered, 100px from the top (poster subjects sit high)
      "d.selection.select([[x,y],[x+s,y],[x+s,y+s],[x,y+s]]);swT('marqueeRectTool');app.echoToOE('PFLSQSET:'+s);"));
  };
  const squareArtClick = () => {
    if (squareArtBusy) return;
    if (!sqArmed) {
      if (saving || jpgBusy || placeBusy || batchBusy || trimBusy || logoExpBusy || posterExpBusy) return;
      squareArtBusy = true; squareArtBtn.textContent = '…'; sqWant = 0;
      posterExpBtn.classList.add('hidden');
      // Capture ctx + home doc, isolate the POSTER art (recording changes → PFLSQVIS), export PNG.
      send('try{var d=app.activeDocument,s=(""+(d.source||""));' + DETECT +
        'if(s.indexOf("pflctx:")==0){app.echoToOE("PFLEXP:"+s.slice(7));}' +
        'else if(s.indexOf("/psd-exports/")>=0){app.echoToOE("PFLURL:"+s);}' +
        'else if(' + JSON.stringify(cfg.name) + '&&' + JSON.stringify(posterDocName) + '&&d.name==' + JSON.stringify(posterDocName) + '){app.echoToOE("PFLEXP:"+' + cfgCtxJson + ');}' +
        'else if(st){app.echoToOE("PFLDOC:"+JSON.stringify({style:st,name:d.name}));}' +
        'else{app.echoToOE("PFLEXP:"+JSON.stringify({raw:d.name}));}' +
        'app.echoToOE("PFLSQHOME:"+d.name);' +
        'function isG(L){return L.typename=="LayerSet";}' +
        'var top=d.layers,pi=-1;' +
        'for(var i=0;i<top.length;i++){if(isG(top[i])&&/^\\s*poster\\s*$/i.test(top[i].name)){pi=i;break;}}' +
        'if(pi<0){app.echoToOE("PFLSQNOPOSTER:");}else{' +
        'var chg=[];' +
        'for(var i=0;i<top.length;i++){var w1=(i==pi);if(top[i].visible!=w1){chg.push({p:[i],v:top[i].visible});top[i].visible=w1;}}' +
        'var kids=top[pi].layers,ai=-1;' +
        'for(var i=0;i<kids.length;i++){if(kids[i].visible){ai=i;break;}}' +
        'if(ai<0){app.echoToOE("PFLSQVIS:"+JSON.stringify(chg));app.echoToOE("PFLSQEMPTY:");}else{' +
        'for(var i=0;i<kids.length;i++){var w2=(i==ai);if(kids[i].visible!=w2){chg.push({p:[pi,i],v:kids[i].visible});kids[i].visible=w2;}}' +
        'app.echoToOE("PFLSQVIS:"+JSON.stringify(chg));' +
        'd.saveToOE("png");}}' +
        '}catch(e){app.echoToOE("PFLERR:"+e);}');
      return;
    }
    // Armed → read the crop tab's selection; onSquareBounds verifies the doc and crops locally.
    squareArtBusy = true; squareArtBtn.textContent = '…';
    send(px("var d=app.activeDocument;" +
      "try{var b=d.selection.bounds;" +
      "app.echoToOE('PFLSQB:'+nv(b[0])+','+nv(b[1])+','+nv(b[2])+','+nv(b[3])+','+Math.round(nv(d.width))+','+Math.round(nv(d.height))+'|'+d.name);}" +
      "catch(e){app.echoToOE('PFLNOSEL:'+d.name);}"));
  };
  // Isolated PNG arrived: restore the PSD, trim, keep the bytes, open them as the crop tab; the
  // delayed script renames the NEW doc (skipped if the open didn't happen) and arms via PFLSQTEMP.
  const onSquareIsoBytes = async (buf) => {
    sqCtx = pendingExport || {}; pendingExport = null;
    restorePosterVis();
    try {
      const trimmed = await trimPngAlpha(buf);
      sqArt = await trimmed.arrayBuffer();
      PP.postMessage(sqArt, '*');   // NO transfer list — the panel keeps sqArt for the crop
      setTimeout(() => send('try{var d=app.activeDocument;' +
        'if(d.name!=' + JSON.stringify(sqHomeName) + '){d.name=' + JSON.stringify(SQ_TEMP) + ';' + SQ_TOOL_JS + 'swT("marqueeRectTool");app.echoToOE("PFLSQTEMP:"+d.name);}' +
        'else{app.echoToOE("PFLSQTEMP:");}' +
        '}catch(e){app.echoToOE("PFLERR:"+e);}'), 600);
    } catch (e) { flashSquare('✗'); note('Square Art failed: ' + (e && e.message ? e.message : e)); }
  };
  // Bounds arrived → verify the crop tab, snap non-square selections visibly, else crop the
  // stored PNG, save, close the tab, return home.
  const onSquareBounds = async (raw) => {
    const bar = raw.indexOf('|');
    const docName = bar >= 0 ? raw.slice(bar + 1) : '';
    if (docName !== sqTempName) { squareArtBusy = false; squareArtBtn.textContent = 'Crop'; note('That isn\'t the crop tab — switch to "' + SQ_TEMP + '", or press ✕ to cancel.'); return; }
    const n = raw.slice(0, bar).split(',').map(parseFloat);
    const [l, t, r, b, cw, ch] = n;
    if (n.length !== 6 || n.some((v) => !isFinite(v))) { squareArtBusy = false; squareArtBtn.textContent = 'Crop'; note('Could not read the selection.'); return; }
    let side = Math.round(Math.min(r - l, b - t, cw, ch));
    if (side < SQ_MIN) { squareArtBusy = false; squareArtBtn.textContent = 'Crop'; note('Selection is ' + side + 'px — square art must be at least ' + SQ_MIN + '×' + SQ_MIN + '.'); return; }
    const x = Math.max(0, Math.min(Math.round((l + r) / 2 - side / 2), cw - side));
    const y = Math.max(0, Math.min(Math.round((t + b) / 2 - side / 2), ch - side));
    // Non-square → snap the on-canvas selection so the user sees the exact crop first.
    if (Math.abs(Math.round(r - l) - Math.round(b - t)) > 2) {
      send(px("var d=app.activeDocument;d.selection.select([[" + x + "," + y + "],[" + (x + side) + "," + y + "],[" + (x + side) + "," + (y + side) + "],[" + x + "," + (y + side) + "]]);app.echoToOE('PFLSQSNAP:" + side + "');"));
      return;
    }
    try {
      if (!sqArt) throw new Error('crop source lost');
      const { blob, side: outSide, srcSide } = await cropPngToJpg(sqArt, { x, y, side, want: sqWant });
      const sizeTxt = outSide + '×' + outSide + (srcSide < outSide ? ' (art was ' + srcSide + 'px, upscaled)' : '');
      const ex = sqCtx || {};
      const base = ex.name ? ex.name : (ex.raw || sqHomeName || pendingDocName).replace(/\.(psd|psb|jpe?g|png|webp|gif|bmp|tiff?)$/i, '');
      const filename = base + ' - squareart.jpg';
      try {
        const r2 = await fetch(location.origin + '/api/maker-tools/squareart-exports/' + encodeURIComponent(filename), {
          method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/octet-stream' }, authHeaders()), body: blob,
        });
        if (!r2.ok) throw new Error('HTTP ' + r2.status);
        let folder = ''; try { folder = (await r2.json()).folder || ''; } catch (_) {}
        note('Saved "' + filename + '" (' + sizeTxt + ') → ' + (folder || 'the square art folder') + '.');
      } catch (e) {
        console.warn('Square art PUT failed, downloading instead:', e);
        download(blob, filename);
        note('Downloaded "' + filename + '" (' + sizeTxt + ') — no square art folder configured (or the save failed).');
      }
      flashSquare('✓');
    } catch (e) { flashSquare('✗'); note('Square Art failed: ' + (e && e.message ? e.message : e)); }
  };
  // Crop the stored PNG to the square, clamped into the art's alpha bounds; rect.want (preset)
  // upscales the output only when the art itself was the limit. Resolves { blob, side, srcSide }.
  const cropPngToJpg = (buf, rect) => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([buf], { type: 'image/png' }));
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const w = img.width, h = img.height;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
      const a = cx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
        if (a[(yy * w + xx) * 4 + 3] > 0) { if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; if (yy < minY) minY = yy; if (yy > maxY) maxY = yy; }
      }
      if (maxX < 0) { reject(new Error('poster art has no visible pixels')); return; }
      const artW = maxX - minX + 1, artH = maxY - minY + 1;
      const srcSide = Math.min(rect.side, artW, artH);
      const x = Math.max(minX, Math.min(rect.x, maxX + 1 - srcSide));
      const y = Math.max(minY, Math.min(rect.y, maxY + 1 - srcSide));
      // Upscale to the wanted preset size ONLY when the selection was maxed out by the art.
      const outSide = (rect.want > srcSide && srcSide >= Math.min(artW, artH)) ? rect.want : srcSide;
      const out = document.createElement('canvas'); out.width = outSide; out.height = outSide;
      const ox = out.getContext('2d');
      ox.imageSmoothingQuality = 'high';
      ox.fillStyle = '#fff'; ox.fillRect(0, 0, outSide, outSide);
      ox.drawImage(cv, x, y, srcSide, srcSide, 0, 0, outSide, outSide);
      out.toBlob((bb) => bb ? resolve({ blob: bb, side: outSide, srcSide }) : reject(new Error('JPEG encode failed')), 'image/jpeg', 0.9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('PNG decode failed')); };
    img.src = url;
  });

  // ---- Batch export --------------------------------------------------------
  // The pure batch/convention/range logic below mirrors frontend/src/lib/photopeaBatch.ts (tested by
  // frontend/tests/lib/photopeaBatch.test.ts) — keep the two in sync when changing behavior.
  // One JPG per poster variant, saved INDIVIDUALLY to the image folder (or downloaded) — no ZIP,
  // no new subfolder. Two modes: (1) layers named s0/s1…/main/show → export each; (2) a single
  // poster with a SEASONS group → ask which seasons (a count "8"=1–8, a range "3-6", or blank=all)
  // plus any singles (Specials/…). Runs one export at a time (Photopea posts one JPG per saveToOE).
  const batchBtn = document.querySelector('[data-act="batch"]');            // amber ⚡ — name-tag batch
  const seasonsBtn = document.querySelector('[data-act="batch-seasons"]');  // blue ⚡ — seasons from one poster
  const batchBar = document.querySelector('.batchbar');
  const batchMsg = document.querySelector('.batchmsg');
  const batchRow = document.querySelector('.batchrow');
  const batchInput = document.querySelector('.batchinput');
  const batchHelp = document.querySelector('.batchhelp');
  // Gradient safety net opt-out — remembered across sessions, ON by default.
  const gradChk = document.querySelector('[data-act="batch-grad"]');
  try { gradChk.checked = localStorage.getItem('posterflow.batchGradient') !== '0'; } catch (_) { gradChk.checked = true; }
  gradChk.addEventListener('change', () => { try { localStorage.setItem('posterflow.batchGradient', gradChk.checked ? '1' : '0'); } catch (_) {} });
  const modeBtn = () => batchMode === 'seasons' ? seasonsBtn : batchBtn;    // the bolt driving the current run
  const resetBolts = () => { batchBtn.textContent = '⚡'; seasonsBtn.textContent = '⚡'; };

  const batchNote = (t) => { batchMsg.textContent = t; };
  const closeBatch = () => { if (!batchBusy) batchBar.classList.add('hidden'); };

  // Full base name + style for the active doc — same resolution the save/JPG paths use.
  const resolveCtx = (source, name) => {
    const s = source || '';
    if (s.indexOf('pflctx:') === 0) { try { const o = JSON.parse(s.slice(7)); return { name: o.name, style: o.style }; } catch (_) {} }
    if (s.indexOf('/psd-exports/') >= 0) { const c = ctxFromUrl(s); if (c) return { name: c.name, style: c.style }; }
    if (cfg.name && name === posterDocName) return { name: cfg.name, style: cfg.style || detectedStyle };
    return { name: (name || pendingDocName).replace(/\.(psd|psb|jpe?g|png|webp|gif|bmp|tiff?)$/i, ''), style: detectedStyle || cfg.style };
  };

  const seasonNumOf = (S) => { const m = (S.n || '').match(/(\d+)/); return m ? parseInt(m[1], 10) : NaN; };
  // Always-ON visibility for a season / single (mirror clickSeason/clickSingle without the toggle-off).
  const seasonChanges = (S) => {
    const parentKey = key(S.p.slice(0, -1));
    const changes = [{ p: S.p, v: true }];
    if (main()) changes.push({ p: main().p, v: true });
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: key(dn.p) === parentKey }));
    byRole('season').forEach((sn) => { if (sn !== S) changes.push({ p: sn.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    changes.push(...yearsOff(), ...seqOff(), ...seqGroupOff());
    return changes;
  };
  // Always-ON visibility for a "Season YYYY" year leaf: show it + the SEASONS group and its own
  // years group, and hide every decade, numbered season, other year, and single (its counterpart to
  // seasonChanges — the year layers live in the "SEASON YEARS TEXT" group, not under a decade).
  const yearChanges = (Y) => {
    const parentKey = key(Y.p.slice(0, -1));
    const changes = [{ p: Y.p, v: true }];
    if (main()) changes.push({ p: main().p, v: true });
    byRole('years').forEach((yg) => changes.push({ p: yg.p, v: key(yg.p) === parentKey }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('year').forEach((yn) => { if (yn !== Y) changes.push({ p: yn.p, v: false }); });
    model.singles.forEach((si) => changes.push({ p: si.p, v: false }));
    changes.push(...seqOff(), ...seqGroupOff());
    return changes;
  };
  const singleChanges = (SI) => {
    const changes = [{ p: SI.p, v: true }];
    for (let i = 1; i < SI.p.length; i++) changes.push({ p: SI.p.slice(0, i), v: true });
    model.singles.forEach((x) => { if (x !== SI) changes.push({ p: x.p, v: false }); });
    byRole('season').forEach((sn) => changes.push({ p: sn.p, v: false }));
    byRole('decade').forEach((dn) => changes.push({ p: dn.p, v: false }));
    changes.push(...yearsOff(), ...seqOff(), ...seqGroupOff());
    return changes;
  };
  const singleSuffix = (SI) => SI.lab === 'SP' ? ' - Specials' : (SI.lab === 'CLS' ? ' - Season 1' : '');

  // Name-tag language — mirror of buildTagItems in frontend/src/lib/photopeaBatch.ts (the tested
  // spec, ported from CL2K batch export.jsx): aliases, s1-8 ranges, cls, smart Collection suffix,
  // topmost-visible-wins duplicates, and text pairing (Season N / Specials / CLS / Collection).
  const MAX_RANGE = 30;
  const normName = (s) => String(s).toLowerCase().replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
  const baseIsCollection = (base) => /collection$/i.test(String(base).replace(/\s*\{[^}]*\}\s*/g, ' ').replace(/\s+/g, ' ').trim());
  const seasonTagOf = (n) => n === 0 ? { key: 's0', kind: 's', n: 0, sort: 100000 } : { key: 's' + n, kind: 's', n: n, sort: n };
  const parseTagName = (nm, baseNorm) => {
    if (nm === 'show' || nm === 'movie' || nm === 'poster' || nm === 'main' || (!!baseNorm && nm === baseNorm))
      return { tags: [{ key: 'show', kind: 'main', n: -1, sort: 0 }], reject: null };
    if (nm === 'c') return { tags: [{ key: 'c', kind: 'c', n: -1, sort: 200000 }], reject: null };
    if (nm === 'cls') return { tags: [{ key: 'cls', kind: 'cls', n: 1, sort: 1.5 }], reject: null };
    const m = /^s(\d{1,4})(?:-(\d{1,4}))?$/.exec(nm);
    if (m) {
      const start = parseInt(m[1], 10);
      if (!m[2]) return { tags: [seasonTagOf(start)], reject: null };
      const end = parseInt(m[2], 10);
      if (end <= start) return { tags: [], reject: '"' + nm + '" was skipped: a range has to count upwards, like "s' + start + '-' + (start + 1) + '"' };
      if (end - start + 1 > MAX_RANGE) return { tags: [], reject: '"' + nm + '" was skipped: it covers ' + (end - start + 1) + ' seasons, more than the ' + MAX_RANGE + ' a single range may expand to' };
      const out = [];
      for (let v = start; v <= end; v++) out.push(seasonTagOf(v));
      return { tags: out, reject: null };
    }
    return { tags: [], reject: null };
  };
  const showText = (changes, t, on) => { changes.push({ p: t.p, v: on }); if (on) for (let i = 1; i < t.p.length; i++) changes.push({ p: t.p.slice(0, i), v: true }); };
  const buildTagItems = (variants, texts, baseName) => {
    const warnings = [];
    const baseNorm = normName(baseName);
    const byKey = {}, keyOrder = [];
    variants.forEach((rv) => {
      const parsed = parseTagName(rv.nm, baseNorm);
      if (parsed.reject) warnings.push(parsed.reject);
      parsed.tags.forEach((tag) => {
        if (!byKey[tag.key]) { byKey[tag.key] = []; keyOrder.push(tag.key); }
        byKey[tag.key].push({ layer: rv, tag });
      });
    });
    const chosen = [], seenK = {}, warnedCombos = {};
    keyOrder.forEach((k) => {
      const cands = byKey[k];
      let pick = cands[0];
      if (cands.length > 1) {
        const vis = cands.find((c) => c.layer.v);
        if (vis) pick = vis;
        const names = [];
        cands.forEach((c) => { if (names.indexOf(c.layer.nm) < 0) names.push(c.layer.nm); });
        const combo = names.join('|');
        if (names.length > 1 && !warnedCombos[combo]) {
          warnedCombos[combo] = true;
          warnings.push(cands.length + ' layers are tagged "' + names.join('" / "') + '" — exported ' +
            (vis ? 'the topmost visible one' : 'the topmost one (none were visible)') + ' and ignored the rest.');
        }
      }
      seenK[k] = true;
      chosen.push(pick);
    });
    if (seenK['cls'] && seenK['s1'])
      warnings.push('Both "s1" and "cls" are tagged — they export to the same " - Season 1" file, so the later one overwrites the other.');
    chosen.sort((a, b) => a.tag.sort - b.tag.sort);
    const collectionBase = baseIsCollection(baseName);
    const items = chosen.map(({ layer, tag }) => {
      const changes = [];
      variants.forEach((o) => changes.push({ p: o.p, v: false }));
      changes.push({ p: layer.p, v: true });
      for (let i = 1; i < layer.p.length; i++) changes.push({ p: layer.p.slice(0, i), v: true });
      const onOff = (list, onFor) => list.forEach((t) => (onFor(t) ? showText(changes, t, true) : changes.push({ p: t.p, v: false })));
      onOff(texts.season, (t) => tag.kind === 's' && tag.n >= 1 && t.n === tag.n);
      onOff(texts.specials, () => tag.kind === 's' && tag.n === 0);
      onOff(texts.cls, () => tag.kind === 'cls');
      onOff(texts.collection, () => tag.kind === 'c');
      const suffix = tag.kind === 'main' ? ''
        : tag.kind === 'c' ? (collectionBase ? '' : ' - Collection')
        : tag.kind === 'cls' ? ' - Season 1'
        : tag.n === 0 ? ' - Specials' : ' - Season ' + tag.n;
      return { suffix: suffix, changes: changes, collection: tag.kind === 'c', key: tag.key };
    });
    return { items: items, warnings: warnings };
  };
  // Parse the tags-mode filter input: blank → null (run everything); otherwise a set of tag keys —
  // tokens like "c", "cls", "main"/"show", "s3", "3", "s1-8" (comma/space separated).
  const parseTagFilter = (str) => {
    const toks = String(str || '').toLowerCase().split(/[\s,]+/).filter(Boolean);
    if (!toks.length) return null;
    const keys = {};
    toks.forEach((t) => {
      if (t === 'c') keys.c = 1;
      else if (t === 'cls') keys.cls = 1;
      else if (t === 'main' || t === 'show' || t === 'movie' || t === 'poster') keys.show = 1;
      else {
        const m = /^s?(\d{1,4})(?:-s?(\d{1,4}))?$/.exec(t);
        if (m) {
          const a = parseInt(m[1], 10);
          const b = m[2] ? parseInt(m[2], 10) : a;
          const lo = Math.min(a, b), hi = Math.max(a, b);
          for (let n = lo; n <= hi && n - lo < 60; n++) keys['s' + n] = 1;
        }
      }
    });
    return keys;
  };

  const parseRange = (str) => {
    const s = (str || '').trim();
    if (!s) return { start: null, end: null };
    if (s.indexOf('-') >= 0) { const parts = s.split('-'); const a = parseInt(parts[0], 10), b = parseInt(parts[1], 10); return { start: isNaN(a) ? 1 : a, end: isNaN(b) ? 9999 : b }; }
    const n = parseInt(s, 10);
    return isNaN(n) ? { start: null, end: null } : { start: 1, end: n };
  };
  const seasonItems = (start, end) => {
    const items = [];
    byRole('season').slice().sort((a, b) => (seasonNumOf(a) || 0) - (seasonNumOf(b) || 0)).forEach((S) => {
      const n = seasonNumOf(S);
      if (isNaN(n)) return;
      if ((start != null && n < start) || (end != null && n > end)) return;
      items.push({ suffix: ' - Season ' + n, changes: seasonChanges(S) });
    });
    // Specials = "season 0": include only when 0 is in the range (or "all"). Never Collection / CLS.
    if ((start == null) || (start <= 0 && (end == null || end >= 0))) {
      const SP = model.singles.find((s) => s.lab === 'SP');
      if (SP) items.push({ suffix: ' - Specials', changes: singleChanges(SP) });
    }
    return items;
  };
  // "Season YYYY" batch: same range filter as seasonItems but over the year layers. Files still use
  // the " - Season <n>" convention (so "Season 2015" lands as a normal season poster). No Specials.
  const isYearRange = (r) => (r.start != null && r.start >= 1900) || (r.end != null && r.end >= 1900);
  const yearItems = (start, end) => {
    const items = [];
    byRole('year').slice().sort((a, b) => (seasonNumOf(a) || 0) - (seasonNumOf(b) || 0)).forEach((Y) => {
      const n = seasonNumOf(Y);
      if (isNaN(n)) return;
      if ((start != null && n < start) || (end != null && n > end)) return;
      items.push({ suffix: ' - Season ' + n, changes: yearChanges(Y) });
    });
    return items;
  };

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const DL_GAP = 500;   // ms between browser downloads on the no-folder path — browsers drop rapid downloads; raise if some still skip

  // One JPG → PUT to the image folder as base+suffix.jpg; on failure download it. Never a ZIP.
  // Returns true when it reached the folder, false when it fell back to a browser download — the batch
  // uses that to throttle only the download path (browsers silently drop rapid back-to-back downloads).
  const putImage = async (buf, filename, style) => {
    const styleQ = style ? '?style=' + encodeURIComponent(style) : '';
    try {
      const r = await fetch(location.origin + '/api/maker-tools/image-exports/' + encodeURIComponent(filename) + styleQ, {
        method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/octet-stream' }, authHeaders()), body: buf,
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return true;
    } catch (e) { console.warn('Batch PUT failed, downloading:', e); download(buf, filename); return false; }
  };

  const batchItemScript = (changes) =>
    'try{var dd=app.activeDocument;var ch=' + JSON.stringify(changes) + ';' +
    'for(var j=0;j<ch.length;j++){var c=dd,L=null,p=ch[j].p;for(var i=0;i<p.length;i++){L=c.layers[p[i]];c=L;}L.visible=ch[j].v;}' +
    'dd.saveToOE("jpg:0.90");}catch(e){app.echoToOE("PFLERR:"+e);}';

  const batchNext = () => {
    if (batchIdx >= batchItems.length) { batchFinish(); return; }
    batchNote('Exporting ' + (batchIdx + 1) + '/' + batchItems.length + '…');
    const item = batchItems[batchIdx];
    send(item.collection ? batchCollectionScript(item.changes) : batchItemScript(item.changes));
  };
  const onBatchBytes = async (buf) => {
    const item = batchItems[batchIdx];
    const saved = await putImage(buf, batchBase + item.suffix + '.jpg', batchStyle);
    if (item.collection && batchColMove) { send(collectionCleanupScript(batchColMove)); batchColMove = null; }   // undo the logo move before the next item (messages are processed in order)
    batchOk++; batchIdx++;
    if (!saved) await sleep(DL_GAP);   // downloaded instead of saved — space downloads out so the browser doesn't drop them
    batchNext();
  };
  const batchFinish = () => {
    batchBusy = false; resetBolts();
    batchNote('Done — exported ' + batchOk + ' JPG' + (batchOk === 1 ? '' : 's') + '.');
    fetchLayers();
    setTimeout(closeBatch, 2600);
  };
  const batchAbort = (msg) => { batchBusy = false; resetBolts(); batchNote('Stopped: ' + msg); };

  // Scan the doc for tag-candidate layers (raw name + visibility — the panel-side buildTagItems
  // parses them), every pairable text layer, and the doc's context — one round-trip. A layer named
  // like the document itself is pre-aliased to "show" in-script (the panel can't know the doc name
  // before scanning).
  // Tags live in the root-level POSTER group when one exists (the template's poster container — the
  // jsx's rule): only its DIRECT children are candidates there, where "poster"/PSD-name aliases are
  // unambiguous. Without a POSTER group, fall back to a whole-tree scan — skipping the "poster"
  // alias so the template's own POSTER group can never be swallowed as a variant and hidden.
  const BATCH_SCAN = 'try{var d=app.activeDocument;var out=[],stx=[],spx=[],clx=[],cox=[];' +
    'var bn=(""+d.name).replace(/\\.[^.]+$/,"").toLowerCase().replace(/^\\s+|\\s+$/g,"").replace(/\\s+/g," ");' +
    'function nn(s){return (""+s).toLowerCase().replace(/^\\s+|\\s+$/g,"").replace(/\\s+/g," ");}' +
    'var TAG=/^s\\d{1,4}(-\\d{1,4})?$/;' +
    'function ali(nm){return nm=="show"||nm=="movie"||nm=="poster"||nm=="main"||(!!bn&&nm==bn);}' +
    'var pg=-1;for(var i=0;i<d.layers.length;i++){var L=d.layers[i];if(L.typename=="LayerSet"&&nn(L.name)=="poster"){pg=i;break;}}' +
    'if(pg>=0){var ks=d.layers[pg].layers;for(var i=0;i<ks.length;i++){var nm=nn(ks[i].name);' +
    'if(TAG.test(nm)||nm=="c"||nm=="cls"||ali(nm)){out.push({nm:(!!bn&&nm==bn)?"show":nm,p:[pg,i],v:ks[i].visible});}}}' +
    'function sc(ls,pa){for(var i=0;i<ls.length;i++){var L=ls[i];var here=pa.concat(i);var nm=nn(L.name);' +
    'if(pg<0&&(TAG.test(nm)||nm=="show"||nm=="movie"||nm=="main"||nm=="c"||nm=="cls"||(!!bn&&nm==bn))){out.push({nm:(!!bn&&nm==bn)?"show":nm,p:here,v:L.visible});}' +
    'var sm=nm.match(/^season\\s*0*(\\d+)$/);' +
    'if(sm){stx.push({n:parseInt(sm[1],10),p:here});}else if(nm=="special"||nm=="specials"){spx.push({p:here});}else if(/^complete limited/.test(nm)){clx.push({p:here});}else if(nm=="collection"){cox.push({p:here});}' +
    'if(L.typename=="LayerSet"){sc(L.layers,here);}}}sc(d.layers,[]);' +
    'app.echoToOE("BATCHINIT:"+JSON.stringify({variants:out,seasonText:stx,specialsText:spx,clsText:clx,collectionText:cox,source:(""+(d.source||"")),name:d.name}));}catch(e){app.echoToOE("PFLERR:"+e);}';

  // Batch prep: (1) gradient safety net — force every root-level GRADIENT group (whole subtree)
  // visible and LEAVE it on (a nudged-off gradient otherwise ruins a whole batch; echoes whether
  // anything changed); (2) jsx parity — manual collection logos (LOGO children named c/c1/c2…)
  // are hidden so they only appear during the Collection placement, never on normal exports.
  const GRAD_SCRIPT = 'try{var d=app.activeDocument,ch=0;function fv(g){if(!g.visible){g.visible=true;ch=1;}if(g.typename=="LayerSet"){for(var j=0;j<g.layers.length;j++)fv(g.layers[j]);}}' +
    'for(var i=0;i<d.layers.length;i++){var L=d.layers[i];if(L.typename=="LayerSet"&&/^\\s*gradients?\\s*$/i.test(L.name))fv(L);}' +
    'function fg(ls){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=="LayerSet"){if(/^\\s*logos?\\s*$/i.test(L.name))return L;var f=fg(L.layers);if(f)return f;}}return null;}' +
    'var lg=fg(d.layers);' +
    'if(lg){for(var i=0;i<lg.layers.length;i++){var nm=(""+lg.layers[i].name).replace(/^\\s+|\\s+$/g,"").toLowerCase();' +
    'if(/^c\\d*$/.test(nm)&&lg.layers[i].visible){lg.layers[i].visible=false;}}}' +
    'app.echoToOE("PFLGRAD:"+ch);}catch(e){app.echoToOE("PFLGRAD:0");}';

  // Collection export: apply the item's visibility, then move the logo so its bottom sits on the
  // collection ruler (181/1500 of canvas height from the bottom) by translating EVERY ART LAYER
  // inside the LOGO group by the same integer dy — a rigid, exactly-reversible move using only
  // ArtLayer.translate (the op Place Logo proves daily). Photopea's GROUP ops are off-limits:
  // group translate throws, group duplicate hangs the script engine outright (verified). So no
  // copies here — and no auto-shrink (a too-tall logo is placed at original size with a warning;
  // scaling real layers isn't losslessly reversible). Direct LOGO children named c/c1/c2… are a
  // manual collection-only logo: only they show for this export (visibility restored by cleanup).
  // Echoes PFLCOLMV:{dy,cv} so the panel builds the exact undo; any failure restores what moved,
  // warns, and the export STILL runs, so the batch can never hang on placement.
  // STEP 1 — read: apply the item's visibility, filter the manual-c layers, and echo the logo's
  // bounds (union of individual layers' bounds — group-level calls misbehave in Photopea) as PLAIN
  // NUMBERS. The panel computes dy in JS and sends the move as a literal (STEP 2): bounds arithmetic
  // INSIDE a Photopea script sign-flips (the documented UnitValue trap — same reason Place Logo
  // works this way). Fail paths export directly (bare) so the batch always advances.
  const batchCollectionScript = (changes) => px(
    'var dd=app.activeDocument;var ch=' + JSON.stringify(changes) + ';' +
    'for(var j=0;j<ch.length;j++){var c=dd,L=null,p=ch[j].p;for(var i=0;i<p.length;i++){L=c.layers[p[i]];c=L;}L.visible=ch[j].v;}' +
    'function fg(ls){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=="LayerSet"){if(/^\\s*logos?\\s*$/i.test(L.name))return L;var f=fg(L.layers);if(f)return f;}}return null;}' +
    'var lg=fg(dd.layers),cv=[];' +
    'try{' +
    'if(lg&&lg.visible){' +
    'var man=[];for(var i=0;i<lg.layers.length;i++){if(/^c\\d*$/.test((""+lg.layers[i].name).replace(/^\\s+|\\s+$/g,"").toLowerCase()))man.push(i);}' +
    'if(man.length){for(var i=0;i<lg.layers.length;i++){cv.push(lg.layers[i].visible);lg.layers[i].visible=(man.indexOf(i)>=0);}}' +
    'var ul=1e9,ut=1e9,ur=-1e9,ub=-1e9;' +
    'function lv(g,gv){for(var i=0;i<g.layers.length;i++){var L=g.layers[i];var ev=gv&&L.visible;' +
    'if(L.typename=="LayerSet"){lv(L,ev);}else if(ev){var bb=L.bounds;var x1=nv(bb[0]),y1=nv(bb[1]),x2=nv(bb[2]),y2=nv(bb[3]);' +
    'if(x2-x1>0&&y2-y1>0){if(x1<ul)ul=x1;if(y1<ut)ut=y1;if(x2>ur)ur=x2;if(y2>ub)ub=y2;}}}}' +
    'lv(lg,true);' +
    'if(ur>ul&&ub>ut){app.echoToOE("PFLCOLGEO:"+ul+","+ut+","+ur+","+ub+","+nv(dd.height)+"|"+JSON.stringify(cv));}' +
    'else{if(cv.length){for(var i=0;i<lg.layers.length;i++){lg.layers[i].visible=cv[i];}}' +
    'app.echoToOE("PFLBWARN:The LOGO group has no visible content — Collection exported without a logo.");dd.saveToOE("jpg:0.90");}' +
    '}else if(lg){app.echoToOE("PFLBWARN:The LOGO group is hidden — Collection exported without a logo.");dd.saveToOE("jpg:0.90");}' +
    'else{app.echoToOE("PFLBWARN:No LOGO group — the Collection poster was exported without a logo.");dd.saveToOE("jpg:0.90");}' +
    '}catch(pe){' +
    'try{if(lg&&cv.length){for(var i=0;i<lg.layers.length;i++){lg.layers[i].visible=cv[i];}}}catch(e3){}' +
    'app.echoToOE("PFLBWARN:Collection logo placement failed ("+pe+") — exported without repositioning the logo.");' +
    'dd.saveToOE("jpg:0.90");}');

  // STEP 2 — move + export: translate every art layer in LOGO by the LITERAL dy the panel computed,
  // then export. Per-leaf try so one stubborn layer can't abort the export.
  const collectionMoveScript = (dy) => px(
    'var dd=app.activeDocument;' +
    'function fg(ls){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=="LayerSet"){if(/^\\s*logos?\\s*$/i.test(L.name))return L;var f=fg(L.layers);if(f)return f;}}return null;}' +
    'var lg=fg(dd.layers);' +
    'if(lg&&' + dy + '!==0){var lvs=[];function lv(g){for(var i=0;i<g.layers.length;i++){var L=g.layers[i];if(L.typename=="LayerSet"){lv(L);}else{lvs.push(L);}}}lv(lg);' +
    'for(var i=0;i<lvs.length;i++){try{lvs[i].translate(0,' + dy + ');}catch(_e){}}}' +
    'dd.saveToOE("jpg:0.90");');

  // Undo the collection move: translate every art layer in LOGO back by -dy, restore the manual-c
  // visibility, and sweep any __PFLTMPLOGO__ orphans left by older (copy-based) runs.
  const collectionCleanupScript = (mv) => px(
    'var d=app.activeDocument;' +
    'function fg(ls){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=="LayerSet"){if(/^\\s*logos?\\s*$/i.test(L.name))return L;var f=fg(L.layers);if(f)return f;}}return null;}' +
    'var lg=fg(d.layers);' +
    'if(lg){var lvs=[];function lv(g){for(var i=0;i<g.layers.length;i++){var L=g.layers[i];if(L.typename=="LayerSet"){lv(L);}else{lvs.push(L);}}}lv(lg);' +
    'if(' + (mv.dy || 0) + '!==0){for(var i=0;i<lvs.length;i++){try{lvs[i].translate(0,' + (-(mv.dy || 0)) + ');}catch(_e){}}}' +
    'var cv=' + JSON.stringify(mv.cv || []) + ';for(var i=0;i<cv.length&&i<lg.layers.length;i++){lg.layers[i].visible=cv[i];}' +
    'if(!lg.visible)lg.visible=true;}' +
    'function fx(ls){for(var i=ls.length-1;i>=0;i--){var L=ls[i];if(L.name=="__PFLTMPLOGO__"){L.remove();}else if(L.typename=="LayerSet"){fx(L.layers);}}}fx(d.layers);' +
    'app.echoToOE("PFLCLEAN:ok");');

  const startBatch = (mode) => {
    if (batchBusy) return;
    batchMode = mode;   // 'tags' (amber) or 'seasons' (blue) — the button picks the mode, no auto-detect
    batchOk = 0; batchIdx = 0;
    batchBar.classList.remove('hidden'); batchRow.classList.add('hidden'); batchHelp.classList.add('hidden');
    batchNote('Scanning…');
    send(BATCH_SCAN);
  };
  // The scan is shared; the active button (batchMode) forces which branch we take, so the two modes
  // never fight over auto-detection. 'tags' = one JPG per s0/s1…/main/show/c layer; 'seasons' = a
  // season range from a single poster's SEASONS group.
  const onBatchInit = (json) => {
    let init; try { init = JSON.parse(json); } catch (_) { batchNote('Scan failed.'); return; }
    const ctx = resolveCtx(init.source, init.name);
    batchBase = ctx.name; batchStyle = ctx.style;
    if (batchMode === 'tags') {
      const built = buildTagItems(init.variants || [],
        { season: init.seasonText || [], specials: init.specialsText || [], cls: init.clsText || [], collection: init.collectionText || [] },
        batchBase);
      if (!built.items.length) { built.warnings.forEach((w) => note('Batch: ' + w)); batchNote('No name-tag layers (s0/s1…, s1-8, main/show/movie/poster, c, cls) in this document. For a single poster with a SEASONS group, use the blue ⚡ instead.'); return; }
      batchConvention = true;
      batchItems = built.items;
      batchWarnings = built.warnings;
      batchRow.classList.remove('hidden'); batchInput.style.display = '';
      batchInput.value = ''; batchInput.placeholder = 'blank = all · filter: c, cls, main, s1-8';
      batchNote('Found ' + batchItems.length + ' tagged export(s)' + (built.warnings.length ? ' (' + built.warnings.length + ' warning(s))' : '') + '. Run all, or type a filter.');
    } else {
      batchWarnings = [];
      if (!(byRole('season').length || model.singles.length)) { batchNote('No SEASONS group or season layers found. For layers tagged s0/s1…/main/show, use the amber ⚡ instead.'); return; }
      batchConvention = false;
      batchRow.classList.remove('hidden'); batchInput.style.display = '';
      batchInput.value = ''; batchInput.placeholder = 'e.g. 8, 0-5, or blank = all'; batchInput.focus();
      batchNote('Which seasons? e.g. "8" (=1–8), "0-5" (0 = Specials), "2015-2020" (years), or blank = all.');
    }
  };
  const runBatch = () => {
    if (batchBusy) return;
    if (!batchConvention) {
      const r = parseRange(batchInput.value);
      batchItems = (isYearRange(r) && byRole('year').length) ? yearItems(r.start, r.end) : seasonItems(r.start, r.end);
    } else {
      const fk = parseTagFilter(batchInput.value);
      if (fk) batchItems = batchItems.filter((it) => fk[it.key]);
    }
    if (!batchItems.length) { batchNote('Nothing matched — nothing to export.'); return; }
    batchBusy = true; modeBtn().textContent = '…'; batchRow.classList.add('hidden');
    batchWarnings.forEach((w) => note('Batch: ' + w));
    batchIdx = 0; batchOk = 0; batchColMove = null;
    if (gradChk.checked) send(GRAD_SCRIPT);   // gradient safety net first (runs before the first item — messages are ordered)
    batchNext();
  };

  // ---- incoming messages from Photopea -------------------------------------
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (typeof d !== 'string') { if (squareArtBusy) { onSquareIsoBytes(d); } else if (posterExpBusy) { onPosterBytes(d); } else if (logoExpBusy) { onLogoBytes(d); } else { onSaved(d); } return; }   // ArrayBuffer = saveToOE result
    if (d.startsWith('PFLNAME:'))       { pendingDocName = d.slice(8) || 'poster'; if (!posterDocName) posterDocName = pendingDocName; }
    else if (d.startsWith('PFLEXP:'))   { try { pendingExport = JSON.parse(d.slice(7)); } catch (_) { pendingExport = null; } }
    else if (d.startsWith('PFLDOC:'))   { let o = null; try { o = JSON.parse(d.slice(7)); } catch (_) {} pendingExport = o ? { save: location.origin + '/api/maker-tools/psd-exports/' + encodeURIComponent(o.name + '.psd') + '?style=' + encodeURIComponent(o.style), name: o.name, style: o.style } : null; }
    else if (d.startsWith('PFLURL:'))   { pendingExport = ctxFromUrl(d.slice(7)); }
    else if (d.startsWith('PFLCTX:'))   { const raw = d.slice(7); activeCtx = null; if (raw && raw.charAt(0) === '{') { try { activeCtx = JSON.parse(raw); } catch (_) {} } updateDocUI(); }
    else if (d.startsWith('PFLDET:'))   { detectedStyle = d.slice(7); updateDocUI(); }
    else if (d.startsWith('PFLSIG:'))   { lastActiveSig = d.slice(7); }   // baseline the watcher from the read we just did → the next poll's identical sig doesn't trigger a redundant re-fetch
    else if (d.startsWith('BATCHINIT:')){ onBatchInit(d.slice(10)); }
    else if (d.startsWith('PFLGRAD:'))  { if (d.slice(8) === '1') note('The GRADIENT group had hidden layers — turned on and left visible in the PSD.'); }
    else if (d.startsWith('PFLBWARN:')) { note('Batch: ' + d.slice(9)); }
    else if (d.startsWith('PFLCOLGEO:')) {
      // Logo bounds arrived as plain numbers — compute dy HERE (in-script bounds math sign-flips),
      // remember the undo data, and send the literal move+export script.
      const raw = d.slice(10);
      const bar = raw.indexOf('|');
      const nums = raw.slice(0, bar).split(',').map(parseFloat);
      let cvv = []; try { cvv = JSON.parse(raw.slice(bar + 1)); } catch (_) {}
      const top = nums[1], bottom = nums[3], H = nums[4];
      const targetBottom = H - (181 / 1500) * H;
      const allowedH = ((400 - 181) / 1500) * H;
      if (bottom - top > allowedH) note('Batch: the logo is taller than fits above the collection ruler — placed at its original size, crossing the max height line.');
      const dy = Math.round(targetBottom - bottom);
      batchColMove = { dy: dy, cv: cvv };
      send(collectionMoveScript(dy));
    }
    else if (d.startsWith('PFLCLEAN:')) { /* collection logo restored — ack only */ }
    else if (d.startsWith('PFLACT:'))   { const sig = d.slice(7); if (sig !== lastActiveSig && !saving && !jpgBusy && !placeBusy && !batchBusy && !logoExpBusy && !posterExpBusy && !squareArtBusy) { lastActiveSig = sig; fetchLayers(); } }
    else if (d.startsWith('PFL:'))      { try { model = JSON.parse(d.slice(4)); model.sequels = model.sequels || []; const ORD = { SP: 0, C: 1, CLS: 2 }; model.singles.sort((a, b) => ORD[a.lab] - ORD[b.lab]); model.sequels.sort((a, b) => (parseInt(seqLabel(a.n), 10) || 0) - (parseInt(seqLabel(b.n), 10) || 0)); render(); } catch (_) {} }
    else if (d.startsWith('PFLGEO:'))   { onGeo(d.slice(7)); }
    else if (d.startsWith('PFLRSZ:'))   { const p = d.slice(7).split(','); placeTranslate(parseFloat(p[0]), parseFloat(p[1])); }
    else if (d.startsWith('PFLPLACED:')){ finishPlace(true); }
    else if (d.startsWith('PFLTRIM:'))  { flashTrim('✓'); }
    else if (d.startsWith('PFLLOGOVIS:')) { try { logoRestore = JSON.parse(d.slice(11)); } catch (_) { logoRestore = null; } }
    else if (d.startsWith('PFLNOLOGO:')) { flashLogoExp('✗'); note('No LOGO group in this document (MM2K templates use text titles).'); }
    else if (d.startsWith('PFLSQSET:')) { const s = d.slice(9); note('Placed a ' + s + '×' + s + ' selection — drag inside it to position, then press Crop.'); }
    else if (d.startsWith('PFLSQSNAP:')) { const s = d.slice(10); squareArtBusy = false; squareArtBtn.textContent = 'Crop'; note('Snapped the selection to ' + s + '×' + s + ' — adjust it if needed, then press Crop.'); }
    else if (d.startsWith('PFLSQB:'))   { onSquareBounds(d.slice(7)); }
    else if (d.startsWith('PFLNOSEL:')) {
      const nm = d.slice(9);
      squareArtBusy = false; squareArtBtn.textContent = 'Crop';
      note(nm !== sqTempName ? 'That isn\'t the crop tab — switch to "' + SQ_TEMP + '", or press ✕ to cancel.'
        : 'No selection — pick a preset or drag a square with the marquee tool (M).');
    }
    else if (d.startsWith('PFLSQHOME:')) { sqHomeName = d.slice(10) || ''; }
    else if (d.startsWith('PFLSQTEMP:')) {
      const nm = d.slice(10);
      if (!nm) { flashSquare('✗'); note('Square Art: Photopea didn\'t open the crop tab.'); }
      else {
        sqTempName = nm;
        squareArtBusy = false; sqArmed = true;
        sqPresets.classList.remove('hidden'); sqCancelBtn.classList.remove('hidden');
        squareArtBtn.textContent = 'Crop';
        note('Opened the poster art in its own tab — pick a preset or drag a square, then press Crop.');
      }
    }
    else if (d.startsWith('PFLPEXLIST:')) {
      let o = null; try { o = JSON.parse(d.slice(11)); } catch (_) {}
      if (!o || !o.items || !o.items.length) { flashPex('✗'); note('Poster export failed.'); }
      else {
        pexCtx = pendingExport || {}; pendingExport = null;
        pexQueue = o.items.slice();
        pexIdx = 0; pexOk = 0; pexUsed = {};
        pexNext();
      }
    }
    else if (d.startsWith('PFLPEXVIS:')) { try { pexRestore = JSON.parse(d.slice(10)); } catch (_) { pexRestore = null; } }
    else if (d.startsWith('PFLNOPEX:')) { flashPex('✗'); note('Select the poster layer first, then press Poster.'); }
    else if (d.startsWith('PFLSQVIS:')) { try { posterRestore = JSON.parse(d.slice(9)); } catch (_) { posterRestore = null; } }
    else if (d.startsWith('PFLSQNOPOSTER:')) { flashSquare('✗'); note('No POSTER group in this document.'); }
    else if (d.startsWith('PFLSQEMPTY:')) { restorePosterVis(); flashSquare('✗'); note('The POSTER group has no visible variant.'); }
    else if (d.startsWith('PFLNOSAVE:')){ saving = false; saveBtn.textContent = '⚠'; setTimeout(() => { saveBtn.textContent = '💾'; }, 1800); note('"' + d.slice(10) + '" isn\'t the poster — use Ctrl+S to save it.'); }
    else if (d.startsWith('PFLERR:'))   { if (squareArtBusy) { restorePosterVis(); flashSquare('✗'); note('Square Art failed: ' + d.slice(7)); } else if (posterExpBusy) { restorePexVis(); pexQueue = []; flashPex('✗'); note('Poster export failed: ' + d.slice(7)); } else if (logoExpBusy) { restoreLogoVis(); flashLogoExp('✗'); note('Logo export failed: ' + d.slice(7)); } else if (trimBusy) { flashTrim('✗'); note('Trim failed: ' + d.slice(7)); } else if (batchBusy) { batchAbort(d.slice(7)); } else if (placeBusy) { finishPlace(false, 'Photopea error: ' + d.slice(7)); } else { note('Error: ' + d.slice(7)); flashSave('💾'); flashJpg('JPG'); } }
    // PFLVIS: ack handled optimistically in commit().
  });

  // ---- controls ------------------------------------------------------------
  saveBtn.addEventListener('click', saveDoc);
  jpgBtn.addEventListener('click', exportJpg);
  logoBtn.addEventListener('click', startLogo);
  fitBtn.addEventListener('click', startFit);
  trimBtn.addEventListener('click', trimDoc);
  logoExpBtn.addEventListener('click', exportLogo);
  posterExpBtn.addEventListener('click', exportPosterLayer);
  squareArtBtn.addEventListener('click', squareArtClick);
  document.querySelectorAll('[data-sq]').forEach((b) => b.addEventListener('click', () => placePreset(parseInt(b.dataset.sq, 10))));
  document.querySelector('[data-act="sq-cancel"]').addEventListener('click', disarmSquare);
  document.querySelector('[data-act="refresh"]').addEventListener('click', fetchLayers);
  // Each bolt toggles ITS mode: click the same bolt again to dismiss; click the other to switch modes.
  const boltClick = (mode) => {
    if (batchBusy || logoExpBusy || posterExpBusy || squareArtBusy) return;
    if (!batchBar.classList.contains('hidden') && batchMode === mode) { closeBatch(); return; }
    startBatch(mode);
  };
  batchBtn.addEventListener('click', () => boltClick('tags'));
  seasonsBtn.addEventListener('click', () => boltClick('seasons'));
  document.querySelector('[data-act="batch-run"]').addEventListener('click', runBatch);
  document.querySelector('[data-act="batch-help"]').addEventListener('click', () => {
    const rows = batchMode === 'tags'
      ? [['blank', 'run everything'], ['c', 'Collection'], ['cls', 'Limited Series'], ['main / show', 'main poster'],
         ['s3 or 3', 'one season'], ['0', 'Specials'], ['s1-8', 'a season range'], ['main, c', 'combine with commas']]
      : [['blank', 'all seasons + Specials'], ['8', 'seasons 1-8'], ['3-6', 'that range'], ['0-5', 'includes Specials'], ['2015-2020', 'year layers']];
    batchHelp.innerHTML = rows.map((r) => '<div><b>' + r[0] + '</b> — ' + r[1] + '</div>').join('');
    batchHelp.classList.toggle('hidden');
  });
  document.querySelector('[data-act="batch-cancel"]').addEventListener('click', closeBatch);
  batchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runBatch(); } });
  window.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveDoc(); } });

  // Reflect the ACTIVE doc: MM2K templates have no LOGO group (text titles), so hide Place Logo for
  // them; show 💾 when the active doc (or the first doc's cfg) has a save target. Called whenever the
  // active doc's context arrives (PFLCTX), so it tracks doc switches in same-tab mode.
  const updateDocUI = () => {
    // The doc's own layer structure is the authoritative PER-DOC signal (LOGO group ⇒ CL2K,
    // SEQUEL ⇒ MM2K — mutually exclusive in both templates). Prefer it over cfg.style, which is
    // frozen at the FIRST doc's launch query and goes stale for later same-tab documents.
    const style = detectedStyle || (activeCtx && activeCtx.style) || cfg.style;
    const canSave = (activeCtx && activeCtx.save) || cfg.save || detectedStyle;
    logoBtn.style.display = (style === 'MM2K') ? 'none' : '';   // Fit Poster stays (same border/canvas)
    logoExpBtn.style.display = (style === 'MM2K') ? 'none' : '';   // no LOGO group on MM2K → nothing to export
    saveBtn.style.display = canSave ? '' : 'none';
    styleName.textContent = style || '—';
    styleName.className = 'style-name' + (style === 'MM2K' ? ' mm2k' : style === 'CL2K' ? ' cl2k' : '');
  };
  updateDocUI();

  // Active-document watcher: the panel mirrors whatever doc is in front. In same-tab mode a new
  // export becomes the active doc; switching docs by hand also counts. Poll a SIGNATURE of the active
  // doc — name + source + its CL2K/MM2K structure (LOGO group ⇒ CL2K, SEQUEL ⇒ MM2K) — and re-read
  // layers when it changes. Keying on the name alone missed a switch between a CL2K and an MM2K
  // export of the SAME title (same filename; style rides in ?style=, and the self-heal below even
  // normalizes both to that same name) — so the badge stayed stale until the plugin was reopened.
  // Paused while a save/JPG/place op is mid-flight.
  // It also SELF-HEALS tab titles: Photopea names a URL-opened doc from the %-encoded, truncated
  // URL basename (e.g. "Mr. and Mrs. (1996) …" → "Mr."), so decode the real filename from each doc's
  // Document.source and set it back — EVERY open doc, not just the active one, so background tabs
  // heal too. This runs on the plugin's OWN interval — the reliable place to do it, since
  // Photopea-side setTimeout can't loop a launch/open-script rename past the load clobber.
  // Only our own /psd-exports/ docs are touched; a dragged-in doc keeps its name.
  const POLL = 'try{var sig="";'
    + 'for(var i=0;i<app.documents.length;i++){try{var dd=app.documents[i],s=""+(dd.source||""),m=s.match(/\\/psd-exports\\/([^/?#]+)/);'
    + 'if(m){var w=decodeURIComponent(m[1]).replace(/\\.psd$/i,"");if(w&&dd.name!==w)dd.name=w;}}catch(_e){}}'
    + 'if(app.documents.length){var ad=app.activeDocument;'
    + 'function hg(ls,re){for(var i=0;i<ls.length;i++){var L=ls[i];if(L.typename=="LayerSet"){if(re.test(L.name))return true;if(hg(L.layers,re))return true;}}return false;}'
    + 'var stt=hg(ad.layers,/^\\s*logos?\\s*$/i)?"CL2K":(hg(ad.layers,/^\\s*sequels?\\s*$/i)?"MM2K":"");'
    + 'sig=ad.name+"\\u0001"+(""+(ad.source||""))+"\\u0001"+stt;}'
    + 'app.echoToOE("PFLACT:"+sig);}catch(e){}';
  setInterval(() => { if (!saving && !jpgBusy && !placeBusy && !batchBusy && !logoExpBusy && !posterExpBusy && !squareArtBusy) send(POLL); }, 1200);

  fetchLayers();   // read the document Photopea loaded from the launch URL (press ⟳ to reload)
})();
</script>
</body>
</html>
