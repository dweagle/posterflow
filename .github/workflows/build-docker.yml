name: build-docker-develop

on:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        env:
          CONFIG_DIR: ${{ github.workspace }}/.ci-tmp/config
          GDRIVE_DIR: ${{ github.workspace }}/.ci-tmp/posters/gdrive
          LOGS_DIR: ${{ github.workspace }}/.ci-tmp/config/logs
          LOG_FILE: ${{ github.workspace }}/.ci-tmp/config/logs/posterflow.log
          DATABASE_URL: sqlite:///${{ github.workspace }}/.ci-tmp/config/posterflow.db
        run: |
          mkdir -p "$CONFIG_DIR" "$GDRIVE_DIR" "$LOGS_DIR"
          python -m pytest -q tests/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run -s test

      - name: Build frontend
        run: npm run -s build

  docker:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME//\//-}"
          BUILD_NUMBER="$(git rev-list --count HEAD)"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/posterflow
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}

      - name: Build and push
        timeout-minutes: 25
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_NUMBER=${{ steps.version.outputs.build_number }}
            BRANCH=${{ steps.version.outputs.branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
