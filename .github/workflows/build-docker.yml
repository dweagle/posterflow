name: build-docker-develop

on:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = oldest native-install target, 3.14 = the Docker image
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Check for undefined names
        # Catches names only referenced in annotations (e.g. missing typing imports)
        run: |
          if OUT=$(python -m pyflakes . | grep -i "undefined name"); then
            echo "$OUT"
            echo "Undefined names crash Python 3.12/3.13 at import."
            exit 1
          fi

      - name: Audit installed Python packages
        # Audits the resolved environment (pins + transitives), not just requirements.txt
        run: python -m pip install pip-audit && python -m pip_audit --progress-spinner off

      - name: Run backend tests
        env:
          CONFIG_DIR: ${{ github.workspace }}/.ci-tmp/config
          GDRIVE_DIR: ${{ github.workspace }}/.ci-tmp/posters/gdrive
          LOGS_DIR: ${{ github.workspace }}/.ci-tmp/config/logs
          LOG_FILE: ${{ github.workspace }}/.ci-tmp/config/logs/posterflow.log
          DATABASE_URL: sqlite:///${{ github.workspace }}/.ci-tmp/config/posterflow.db
        run: |
          mkdir -p "$CONFIG_DIR" "$GDRIVE_DIR" "$LOGS_DIR"
          python -m pytest -q tests/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend packages
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm run -s test

      - name: Build frontend
        run: npm run -s build

  docker:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: read_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Compute build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/posterflow
            ghcr.io/${{ github.repository_owner }}/posterflow
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=${{ steps.read_version.outputs.version }}

      # Scan a local amd64 build before anything is pushed; the multi-arch push below reuses its cache
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: posterflow:scan
          build-args: |
            BRANCH=${{ steps.version.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (report fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: posterflow:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Publish scan report
        run: |
          { echo '### Image scan: fixable HIGH/CRITICAL'; echo '```'; cat trivy-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt

      - name: Scan image (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: posterflow:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Build and push
        timeout-minutes: 25
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BRANCH=${{ steps.version.outputs.branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ESCAPED=$(echo "$VERSION" | sed 's/\./\\./g')
          awk "/^## \[${ESCAPED}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            > /tmp/release_notes.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release_notes.txt \
              --target "${{ github.sha }}" \
              --prerelease
          fi
