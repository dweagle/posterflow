name: deploy-pages

# Deploys the Photopea plugin and the drive recommendation page to GitHub Pages,
# only when one of them changes. Requires Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).

on:
  push:
    branches: [develop]
    paths:
      - 'photopea-posterflow/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the drive page matches its sources
        run: python3 docs/build_gdrives.py --check

      - name: Stage site
        # plugin URL stays identical; the drive page lands at …/posterflow/gdrives/
        run: |
          mkdir -p _site/photopea-posterflow _site/gdrives
          cp -r photopea-posterflow/. _site/photopea-posterflow/
          cp docs/gdrives.html _site/gdrives/index.html
          cp -r docs/images _site/gdrives/images
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
