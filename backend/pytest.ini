[pytest]
# pytest-asyncio 1.4 asks for this to be explicit; function scope is what the suite has always used.
asyncio_default_fixture_loop_scope = function
# Upstream deprecations this code base cannot act on (starlette's test client, anyio's pytest
# plugin, slowapi), hidden so a warning from our own code stands out.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:_pytest.python.CallSpec2 has been renamed
    ignore:'asyncio.iscoroutinefunction' is deprecated
